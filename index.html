<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Floor Ready</title>
<style>
/* Layout: phone-first, three parts (Practice, Learn, Log) in a bottom dock. SharkNinja teal, black, white, silver. */
:root{
  --bg:#ffffff; --surface:#f2f3f4; --surface-2:#e4e5e7; --ink:#000000; --muted:#4b4c4e;
  --line:#d3d4d6; --teal:#00a5af; --on-teal:#000000; --warn:#e74c39; --ok:#97c93c;
  --chip-a-bg:#000000; --chip-a-ink:#ffffff; --hh:48px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#171717; --surface-2:#2a2a2a; --ink:#ffffff; --muted:#bbbdc0;
    --line:#333333; --chip-a-bg:#ffffff; --chip-a-ink:#000000; color-scheme:dark;
  }
  :root:not([data-theme="light"]) .logo{filter:invert(1);mix-blend-mode:screen}
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#171717; --surface-2:#2a2a2a; --ink:#ffffff; --muted:#bbbdc0;
  --line:#333333; --chip-a-bg:#ffffff; --chip-a-ink:#000000; color-scheme:dark;
}
:root[data-theme="dark"] .logo{filter:invert(1);mix-blend-mode:screen}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.45 "Gotham","Proxima Nova","Helvetica Neue",Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px}
h1,h2,h3,p{margin:0}
.pivot{display:inline-block;width:26px;height:9px;background:var(--teal);transform:skewX(-24deg);flex:none}

/* header and dock */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;height:var(--hh)}
.logo-btn{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.logo{height:19px;width:auto;display:block;mix-blend-mode:multiply}
.app{font-weight:700;font-size:12px;color:var(--muted);border-left:1px solid var(--line);padding-left:10px;line-height:1}
.pts{border:1.5px solid var(--ink);background:none;border-radius:999px;padding:4px 11px;font-weight:700;font-size:12px}
.pts.on{background:var(--teal);border-color:var(--teal);color:#000}
.dock{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:640px;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock button{background:none;border:0;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted)}
.dock button[aria-current="page"]{color:var(--ink)}
.dock button[aria-current="page"] svg{stroke:var(--teal)}
.dock svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
body[data-view="session"] .dock{display:none}
main{padding-top:14px;padding-bottom:88px;min-height:70vh}
body[data-view="session"] main{padding-top:0;padding-bottom:0}

/* shared bits */
.h1{font-size:clamp(20px,5.4vw,26px);line-height:1.12;font-weight:700}
.h2{font-size:15px;font-weight:700;margin-bottom:6px}
.lede{margin-top:6px;color:var(--muted);font-size:13px}
.lab{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:none}
.srcnote{font-size:11.5px;color:var(--muted)}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:999px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:6px 8px;border-radius:999px;font-weight:700;font-size:12.5px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--teal);color:#000}
.ghost{background:none;border:1.5px solid var(--ink);border-radius:999px;padding:6px 13px;font-weight:700;font-size:12.5px}
.ghost:hover{border-color:var(--teal)}
.primary{background:var(--teal);color:#000;border:0;border-radius:999px;padding:9px 18px;font-weight:700;font-size:13.5px}
.primary:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;gap:6px;overflow-x:auto;margin:10px 0;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1.5px solid var(--line);background:none;border-radius:999px;padding:5px 12px;font-weight:700;font-size:12.5px}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px}
.chip.shark{background:var(--chip-a-bg);color:var(--chip-a-ink)}
.chip.ninja{background:var(--teal);color:#000}
.empty{padding:16px;border:1.5px dashed var(--line);border-radius:10px;color:var(--muted);font-size:13px}
.banner{margin:10px 0;padding:9px 12px;border-left:4px solid var(--warn);background:var(--surface);font-size:12.5px}
.card{margin-top:12px;padding:14px;background:var(--surface);border-radius:4px 14px 14px 4px;border-left:5px solid var(--teal)}
.sec{margin-top:20px}
.priv{margin-top:16px;font-size:11.5px;color:var(--muted)}
ul.clean{margin:0;padding-left:16px;display:grid;gap:5px;font-size:13px}
.thumbwrap{background:#fff;border-radius:10px;display:grid;place-items:center;overflow:hidden;flex:none}
.thumbwrap img{display:block;width:100%;height:100%;object-fit:contain}

/* home */
.hello{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.hello b{color:var(--ink)}
.sfield{position:relative;margin-top:12px}
.sfield svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}
.sfield input{width:100%;border:2px solid var(--ink);border-radius:999px;padding:11px 16px 11px 40px;font-size:16px;background:var(--bg);color:var(--ink)}
.sfield input:focus{border-color:var(--teal);outline:3px solid rgba(0,165,175,.3);outline-offset:0}
.sres:empty{display:none}
.sres{margin-top:8px}
.sres .inner{border:1.5px solid var(--line);border-radius:4px 12px 12px 4px;padding:0 12px}
.sres .q:first-child{border-top:0}
.hcards{display:grid;gap:10px;margin-top:16px}
.hcard{position:relative;display:grid;grid-template-columns:64px 1fr 18px;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1.5px solid transparent;border-radius:4px 16px 16px 4px;padding:12px 12px 12px 18px;min-width:0}
.hcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--teal);clip-path:polygon(0 0,100% 0,35% 100%,0 100%)}
.hcard:hover{border-color:var(--teal)}
.hm{display:grid;place-items:center;height:56px}
.hm svg{width:34px;height:34px;fill:none;stroke:var(--teal);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.th4{display:grid;grid-template-columns:1fr 1fr;gap:3px;width:60px}
.th4 .thumbwrap{width:28px;height:26px;border-radius:5px}
.ht{display:block;min-width:0}
.ht b{display:block;font-size:16px;line-height:1.15}
.ht span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.ht em{display:block;font-style:normal;font-size:12px;font-weight:700;margin-top:4px}
.hgo svg{width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* practice */
.phead{display:flex;gap:12px;align-items:center;margin:4px 0 10px}
.phead .thumbwrap{width:64px;height:64px}
.phead b{display:block;font-size:15px;line-height:1.2}
.phead span{font-size:12px;color:var(--muted)}
.facts{margin:0 0 8px;border:1.5px solid var(--line);border-radius:4px 12px 12px 4px;padding:0 12px}
.facts>summary{cursor:pointer;list-style:none;padding:9px 0;font-weight:700;font-size:12.5px}
.facts>summary::-webkit-details-marker{display:none}
.facts ul{margin:0 0 8px;padding-left:16px;display:grid;gap:3px;font-size:12.5px}
.facts p{margin:0 0 8px}
.q{border-top:1px solid var(--line)}
.q summary{list-style:none;cursor:pointer;padding:11px 0;display:grid;gap:1px}
.q summary::-webkit-details-marker{display:none}
.q summary b{font-weight:700;font-size:14px;line-height:1.3}
.q summary small{color:var(--muted);font-size:11.5px}
.q .qb{padding:0 0 12px;display:grid;gap:8px;font-size:13px}
.qlist{border:1.5px solid var(--line);border-radius:4px 12px 12px 4px;padding:0 12px}
.qlist .q:first-child{border-top:0}
.sayline{padding:8px 11px;background:var(--surface);border-left:4px solid var(--teal);font-weight:600}
.care{padding:8px 11px;border-left:4px solid var(--warn);background:var(--surface)}
.why{color:var(--muted);font-size:12.5px}
.yt{display:inline-block;margin-top:3px;font-size:12px;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.ytb{display:inline-block;text-decoration:none}
.apx{display:grid;gap:8px;padding-bottom:10px;font-size:12.5px}
.apx ol,.apx ul{margin:0}
.vcard{border:1.5px solid var(--line);margin-top:8px;border-radius:4px 12px 12px 4px;padding:0 12px}
.vcard summary{cursor:pointer;padding:10px 0;font-weight:700;list-style:none}
.vcard summary::-webkit-details-marker{display:none}
.vcard .vb{padding:0 0 10px;display:grid;gap:6px;font-size:13px}
.tag-warn{font-size:11px;font-weight:700;background:var(--warn);color:#000;border-radius:999px;padding:1px 8px;margin-left:6px}
.gap{display:grid;gap:2px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.gap .st{justify-self:start;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--surface-2)}
.topics{display:flex;gap:6px;overflow-x:auto;margin:6px 0 12px;scrollbar-width:none}
.topics::-webkit-scrollbar{display:none}
.topic{flex:none;border:1.5px solid var(--line);background:none;border-radius:999px;padding:5px 11px;font-weight:700;font-size:12px;display:inline-flex;gap:6px;align-items:center}
.topic.on{border-color:var(--teal);background:var(--teal);color:#000}
.tk{font-size:10.5px;font-weight:700;border-radius:999px;padding:0 7px;background:var(--surface-2);color:var(--ink)}
.tk.best{background:var(--ok);color:#000}.tk.risk{background:var(--warn);color:#000}
.shopbub{padding:12px 14px;background:var(--surface);border-left:5px solid var(--teal);margin-bottom:10px}
.shopbub q{display:block;font-size:clamp(16px,4.4vw,19px);font-weight:700;line-height:1.3;margin-top:3px;quotes:"\201C" "\201D"}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:24px 1fr;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:4px 12px 12px 4px;padding:10px 12px;min-width:0;font-size:13.5px}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt .ol{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink);font-weight:700;font-size:12px}
.opt .ot{overflow-wrap:anywhere}
.opt.done:not(.sel){opacity:.7}
.opt.sel.best{border-color:var(--ok);border-width:2.5px}
.opt.sel.ok{border-color:var(--muted);border-width:2.5px}
.opt.sel.risk{border-color:var(--warn);border-width:2.5px}
.fb{margin:-3px 0 2px 34px;padding:8px 11px;background:var(--surface);border-left:4px solid var(--line);font-size:12.5px}
.fb.best{border-left-color:var(--ok)}.fb.risk{border-left-color:var(--warn)}
.vtag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:0 8px;margin-right:5px;background:var(--surface-2)}
.vtag.best{background:var(--ok);color:#000}.vtag.risk{background:var(--warn);color:#000}
.say{margin-top:12px;padding:12px 14px;background:var(--surface);border-left:5px solid var(--teal)}
.say q{display:block;font-size:15px;font-weight:700;line-height:1.3;margin-top:3px;quotes:"\201C" "\201D"}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.personas{display:grid;gap:8px;margin-top:8px}
.pcard{position:relative;text-align:left;background:var(--surface);border:1.5px solid transparent;border-radius:4px 14px 14px 4px;padding:11px 12px 10px 18px;display:flex;flex-direction:column;gap:5px;min-width:0}
.pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--teal);clip-path:polygon(0 0,100% 0,35% 100%,0 100%)}
.pcard:hover{border-color:var(--teal)}
.pcard-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.vs{font-size:11.5px;color:var(--muted);font-weight:700}
.pcard-quote{font-size:14px;line-height:1.3;font-weight:700}
.pcard-name{font-size:12px;color:var(--muted)}

/* chat session */
.session{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.s-top{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh));z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px 0}
.s-title{flex:1;min-width:0}
.s-title b{display:block;font-size:14px;line-height:1.2}
.s-title span{font-size:11.5px;color:var(--muted)}
.icon-btn{background:none;border:1.5px solid var(--line);border-radius:999px;width:38px;height:38px;display:grid;place-items:center;flex:none}
.icon-btn[aria-pressed="true"]{border-color:var(--teal);background:var(--teal);color:#000}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.brief{margin:10px 0 4px;padding:8px 11px;border-left:4px solid var(--teal);background:var(--surface);font-size:12px;color:var(--muted)}
.thread{flex:1;padding:10px 0 14px}
.b{max-width:88%;padding:8px 12px;border-radius:14px;margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px}
.b.shopper{background:var(--surface);border-bottom-left-radius:4px}
.b.you{background:var(--teal);color:#000;margin-left:auto;border-bottom-right-radius:4px}
.b.wait{color:var(--muted);font-style:italic}
.note{font-size:12.5px;color:var(--muted);margin:0 0 10px;padding:8px 12px;border:1px dashed var(--line);border-radius:10px}
.note button{background:none;border:0;padding:0;text-decoration:underline;font-weight:700}
.composer{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.c-row{display:flex;gap:6px;align-items:flex-end}
.c-row textarea{flex:1;min-width:0;resize:none;min-height:40px;max-height:120px;border:1.5px solid var(--line);border-radius:20px;padding:9px 14px;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.3}
.c-row textarea:focus{border-color:var(--teal);outline:none}
.c-tools{display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap}
.linkish{background:none;border:0;padding:0;font-size:12px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.micnote{font-size:11.5px;color:var(--muted)}

/* debrief */
.deb h1{font-size:clamp(20px,5.4vw,26px);line-height:1.12;font-weight:700}
.deb .sub{margin-top:6px;color:var(--muted);font-size:13px}
.scores{margin:16px 0 4px;display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:560px){.scores{grid-template-columns:1fr 1fr}}
.sc{border-top:3px solid var(--teal);padding-top:8px}
.sc-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sc-h b{font-size:13px}
.sc p{margin-top:4px;font-size:12.5px;color:var(--muted)}
.meter{display:inline-flex;gap:3px}
.meter i{width:16px;height:8px;background:var(--surface-2);transform:skewX(-24deg)}
.meter i.on{background:var(--teal)}
.reveal{margin:16px 0;border:1.5px solid var(--ink)}
.reveal summary{list-style:none;cursor:pointer;padding:11px 13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--teal);color:#000;font-size:13.5px}
.reveal summary span{background:var(--bg);color:var(--ink);padding:2px 10px;border-radius:999px;font-size:12px}
.reveal summary::-webkit-details-marker{display:none}
.reveal .rv{padding:12px 13px;display:grid;gap:8px;font-size:13px}
.found{font-weight:700}
.two{display:grid;gap:16px;grid-template-columns:1fr;margin-top:4px}
@media (min-width:560px){.two{grid-template-columns:1fr 1fr}}
.two h3,.h3{font-size:14px;font-weight:700;margin-bottom:6px}
.flag{margin-top:14px;padding:11px 13px;border-left:4px solid var(--warn);background:var(--surface);font-size:13px}
.themes{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.theme{border:1.5px solid var(--line);border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700}
.loading{padding:40px 0;display:grid;gap:10px;justify-items:start}
.loading .pivot{width:52px}

/* learn */
.lprod{border:1.5px solid var(--line);margin:0 0 10px;border-radius:4px 14px 14px 4px;overflow:hidden}
.lprod>summary{list-style:none;cursor:pointer;padding:10px 12px;display:grid;grid-template-columns:56px 1fr 16px;gap:12px;align-items:center}
.lprod>summary::-webkit-details-marker{display:none}
.lprod>summary .thumbwrap{width:56px;height:56px}
.lprod>summary b{display:block;font-size:14.5px;line-height:1.2}
.lprod>summary small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.lprod>summary .pr{font-size:12px;font-weight:700;margin-top:3px;display:block}
.lprod>summary .car svg{width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.lprod[open]>summary .car svg{transform:rotate(90deg)}
.lprod[open]>summary{border-bottom:1px solid var(--line);background:var(--surface)}
.lsec{padding:12px 12px 2px}
.lsec h3{font-size:13px;font-weight:700;margin:0 0 6px}
.lsec p{margin:0;font-size:13px}
.specs{display:grid;grid-template-columns:1fr 1fr;margin:0;column-gap:14px}
.specs div{padding:6px 0;border-top:1px solid var(--line);min-width:0}
.specs dt{font-size:11px;font-weight:700;color:var(--muted)}
.specs dd{margin:0;font-size:12.5px;overflow-wrap:anywhere}
.specs dd em{font-style:normal;color:var(--muted);font-size:11px}
.feat{padding:8px 11px;border-left:4px solid var(--teal);background:var(--surface);margin-bottom:7px;font-size:13px}
.feat b{display:block}
.feat p{margin:1px 0 0;font-size:12.5px}
.feat .gain{font-weight:700;margin-top:3px}
.fitgrid{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:560px){.fitgrid{grid-template-columns:1fr 1fr}}
.flagbox{margin:8px 12px 0;padding:9px 11px;border-left:4px solid var(--warn);background:var(--surface);font-size:12.5px}
.flagbox b{display:block;margin-bottom:3px}
.flagbox ul{margin:0;padding-left:16px;display:grid;gap:3px}
.lact{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px}
.tbl{overflow-x:auto;margin:10px 0 16px;border:1.5px solid var(--line)}
.tbl table{border-collapse:collapse;min-width:520px;width:100%;font-size:12.5px}
.tbl th,.tbl td{padding:8px 9px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}
.tbl thead th{border-top:0;background:var(--surface);font-weight:700}
.tbl th[scope="row"]{position:sticky;left:0;background:var(--surface);font-weight:700;min-width:90px}
.need{display:grid;gap:1px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.need span{color:var(--muted);font-size:12.5px}

/* compare: sticky product header, grey section bands, centred values */
.cmp{margin:10px 0 16px;border:1.5px solid var(--line);background:var(--bg)}
.chd{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh));z-index:15;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));background:var(--bg);border-bottom:1.5px solid var(--line);box-shadow:0 6px 10px -8px rgba(0,0,0,.35)}
.chead{padding:9px 6px 8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;min-width:0;border-left:1px solid var(--line)}
.chead:first-child{border-left:0}
.chead.us{box-shadow:inset 0 3px 0 var(--teal)}
.chead .thumbwrap{width:52px;height:52px;margin-bottom:2px}
.chead b{font-size:12px;line-height:1.2;overflow-wrap:anywhere}
.chead strong{font-size:15px;line-height:1.1;font-variant-numeric:tabular-nums}
.chead small{font-size:10.5px;color:var(--muted);line-height:1.2}
.cb{font-size:10.5px;font-weight:700;border-radius:999px;padding:0 8px;background:var(--surface-2);color:var(--ink)}
.cb.shark{background:var(--chip-a-bg);color:var(--chip-a-ink)}.cb.ninja{background:var(--teal);color:#000}
.csec{background:var(--surface-2);padding:7px 11px;font-weight:700;font-size:12.5px}
.crw{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));border-top:1px solid var(--line)}
.cc{padding:10px 6px;text-align:center;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.cc:first-child{border-left:0}
.cc b{font-size:13px;line-height:1.2;overflow-wrap:anywhere}
.cc span{font-size:11px;color:var(--muted);line-height:1.25}
.cc.us{background:rgba(0,165,175,.10)}
.cc.cf b{color:var(--muted);font-weight:600;font-style:italic}
.cmpbox{padding:10px 12px;border-top:3px solid var(--teal);background:var(--surface)}
.cmpbox.be{border-top-color:var(--warn)}
.cmpbox h3{margin:0 0 6px;font-size:13px}

/* terms and cost */
.term{border:1.5px solid var(--line);margin:0 0 8px;border-radius:4px 12px 12px 4px;padding:0 12px}
.term>summary{padding:10px 0;list-style:none;cursor:pointer;display:grid;gap:2px}
.term>summary::-webkit-details-marker{display:none}
.term>summary b{font-size:14px}
.term>summary small{font-size:12px;color:var(--muted)}
.term .qb{padding:0 0 10px;display:grid;gap:8px;font-size:13px}
.benefit{padding:8px 11px;background:var(--surface);border-left:4px solid var(--teal);font-weight:700}
.costcard{margin:6px 0 16px;padding:13px;background:var(--surface);border-left:5px solid var(--teal)}
.cbody{display:grid;margin-top:10px}
.crow{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.crow>div{min-width:0}
.crow b{display:block;font-size:13px}
.crow span{display:block;font-size:11.5px;color:var(--muted)}
.crow em{font-style:normal;font-weight:700;font-size:14px;text-align:right;font-variant-numeric:tabular-nums;flex:none;max-width:48%}
.cnote{margin:10px 0 6px;font-size:13px}

/* log */
.setup input,.logf input,.logf select,.logf textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg);color:var(--ink);font-size:16px;margin-top:6px}
.logf textarea{min-height:76px;resize:vertical}
.logf{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
.logf>*{min-width:0}
.stat{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:end}
.stat .big{font-size:36px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.stat .big small{font-size:13px;font-weight:700;margin-left:4px}
.lvl{font-weight:700;font-size:13px;justify-self:end;text-align:right}
.track{grid-column:1/-1;height:8px;background:var(--surface-2);transform:skewX(-24deg);margin:6px 0 2px}
.track i{display:block;height:100%;background:var(--teal)}
.mini{grid-column:1/-1;display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.mini b{color:var(--ink)}
.lb-row{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.lb-row .rk{font-weight:700;color:var(--muted);text-align:center}
.lb-row.me{background:rgba(0,165,175,.12);margin-inline:-8px;padding-inline:8px}
.lb-row small{display:block;color:var(--muted);font-size:11px}
.lb-row .pt{font-weight:700;font-variant-numeric:tabular-nums}
.lb-row.top1 .rk{color:var(--teal)}
.bars{display:grid;gap:8px;margin:8px 0 0}
.bar{display:grid;grid-template-columns:minmax(100px,40%) 1fr 22px;gap:8px;align-items:center;font-size:12.5px}
.bar i{display:block;height:9px;background:var(--teal);transform:skewX(-24deg);transform-origin:left}
.bar em{font-style:normal;font-weight:700;text-align:right}
.recent{display:grid;gap:6px;margin-top:8px}
.recent div{padding:8px 11px;border-left:4px solid #bbbdc0;background:var(--surface);font-size:12.5px}
.rules{margin-top:12px;border:1.5px solid var(--line);border-radius:4px 12px 12px 4px;padding:0 12px}
.rules summary{cursor:pointer;padding:10px 0;font-weight:700;font-size:13px;list-style:none}
.rules summary::-webkit-details-marker{display:none}
.rules .rb{padding:0 0 10px;font-size:12.5px;display:grid;gap:6px}
.rules table{border-collapse:collapse;width:100%}
.rules td{padding:4px 0;border-top:1px solid var(--line)}
.rules td:last-child{text-align:right;font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:8px 16px;border-radius:999px;font-size:13px;font-weight:700;z-index:60;max-width:90vw;display:none;text-align:center}
@media (prefers-reduced-motion:no-preference){
  .deb .meter i.on{animation:fill .5s both}
  @keyframes fill{from{background:var(--surface-2)}to{background:var(--teal)}}
}

</style>

 {q:`Dyson mein sofa, curtain sab ho jaata hai.`,g:`Attachments. They want one device, not two.`,
  why:`Shoppers do not want to buy and store two machines.`,
  say:`Sahi baat hai. Hydrovac floor aur carpet ke liye hai. Aapki safai mein floor kitna hai aur sofa-parde kitne? Usi hisaab se bataunga.`,
  care:`Hydrovac does not cover sofas, curtains or ceilings. Say so before they find out at home.`},
 {q:`2 saal ka accidental damage cover milega?`,g:`Warranty. Asked directly by shoppers who tried Dyson first.`,
  why:`Dyson offers two-year accidental damage cover. Shark does not.`,
  say:`Accidental damage cover Shark ke saath nahi aata. Standard warranty mein kya hai wo main saaf bata deta hoon. Aapko kis cheez ka darr hai, bacche ya girne ka?`,
  care:`Never imply a cover that does not exist. Read the approved warranty wording exactly.`},
 {q:`Battery sirf 25 minute?`,g:`Run time. Shoppers expect longer after hearing the charging time.`,
  why:`Long charging next to a short run time feels like a bad trade.`,
  say:`Ghar kitna bada hai? Ek charge mein kitna ho jaata hai wo hum yahin andaza laga lete hain. Zyada bada hai toh main seedha bol dunga.`,
  care:`Training material confirms about 25 minutes in Eco mode and about 4 hours to charge. Do not promise coverage in square feet unless the approved sheet says so.`},
 {q:`Pehle ghar pe demo ho sakta hai?`,g:`Home demo. Competitors offer it before purchase.`,
  why:`Dyson and others offer pre-sale home demos. Shark demos only after purchase, and the process is slow.`,
  say:`Ghar pe demo kharidne ke baad hota hai. Abhi yahan aapke jaise floor pe chala ke dikha deta hoon, aur jo bhi sawal ho poochh lijiye.`,
  care:`Be upfront about the post-purchase timing. Do not promise a date.`},
 {q:`Floor kitni der mein sookhta hai?`,g:`Drying time.`,
  why:`Wet floors worry families with kids and elders.`,
  say:`Lagbhag 30 second mein sookh jaata hai, aap turant chal sakte ho.`,
  care:`Training says 30 seconds. Surface and weather vary, so say "about".`},
 {q:`Bai ke pochhe se kya farak?`,g:`Maid mopping.`,
  why:`Maids often reuse one bucket of dirty water.`,
  say:`Isme saaf paani ka alag tank hai aur ganda paani alag, toh ganda paani wapas floor par nahi lagta. Saaf 500 ml, ganda 360 ml.`,
  care:`Do not run down household help. Talk about the separate tanks.`},
 {q:`Machine ko saaf karna jhanjhat hoga?`,g:`Self-clean.`,
  why:`A dirty mop head puts shoppers off.`,
  say:`Dock par rakho, 2 minute mein brush aur floorhead khud saaf ho jaate hain. Brush roll anti-microbial hai, toh badbu kam hoti hai.`,
  care:`Training: self-clean in 2 minutes, anti-microbial brush roll.`},
 {q:`Awaaz kitni hai?`,g:`Noise.`,
  why:`Shoppers compare it with their vacuum.`,
  say:`Lagbhag 86 dB, jaise zyadatar vacuum cleaners.`,
  care:`Do not call it quiet. Training says 86 dB, like most vacuums.`},
 {q:`Rug par chalega?`,g:`Rugs.`,
  why:`Training lists rug mode as a point other brands lack.`,
  say:`Haan, Freshen mode rug aur mat ke liye hai. Aap khud chala ke dekhiye.`,
  care:`Do not call it a deep carpet clean. Let the shopper try it, as the training suggests.`},
 {q:`Chhupi hui dhool kaise dikhegi?`,g:`LED light.`,
  why:`Shoppers doubt that floors are really clean.`,
  say:`Isme LED light hai jo chhupi hui dhool dikhati hai. Aap floor par khud dekhiye.`,
  care:`Training: the LED reveals invisible dust.`},
 {q:`Baal brush mein phasenge? Ghar mein lambe baal hain.`,g:`Hair tangling.`,
  why:`Owners of wet-and-dry cleaners often complain about hair wrapping on the brush.`,
  say:`Lambe baal kisi bhi brush roll mein lapet sakte hain. HydroVac ka self-clean dock brush ko saaf karta hai. Ghar mein kitne baal girte hain? Main brush dikhata hoon.`,
  care:`Do not say HydroVac has anti-hair-wrap. The training lists that for Shark Power Detect. Show the brush and the self-clean.`},
 {q:`Diwaar ke kinare tak saaf karta hai?`,g:`Edges.`,
  why:`Online owners say wet-and-dry cleaners can miss edges.`,
  say:`Main yahin chala ke dikhata hoon ki floorhead kinare tak kaise jaata hai.`,
  care:`Online posts say it does not reach right up to walls. Do not promise edge cleaning. Demo it.`},
 {q:`Wooden ya laminate floor kharab toh nahi hoga?`,g:`Floor safety.`,
  why:`Shoppers worry that water damages wood and laminate.`,
  say:`Hard Floor mode hard floors ke liye hai aur floor jaldi sookhta hai. Aapka floor kaisa hai, wooden, laminate ya tile? Floor banane wale ki salah bhi dekh lijiye.`,
  care:`Do not promise it is safe for every wood or laminate floor. Suggest checking the floor maker's advice. Confirm approved wording.`},
 {q:`Dark floor par dhabbe ya streak rehte hain?`,g:`Streaks.`,
  why:`Dark floors show film and streaks easily.`,
  say:`Saaf tank aur sahi cleaning solution se streak kam hote hain. Main aapko dikhata hoon.`,
  care:`Online owners report streaks on dark floors. Do not promise streak-free results. Confirm the recommended solution.`},
 {q:`Sirf paani se chalega ya solution chahiye?`,g:`Cleaning solution.`,
  why:`Shoppers ask about running cost.`,
  say:`India mein kaunsa solution milta hai aur sirf paani se chalega ya nahi, main approved sheet se confirm karke bataunga.`,
  care:`Not confirmed for India. Global pages sell the solution separately. Do not guess.`},
 {q:`Tank empty ka error aaye toh?`,g:`Reliability.`,
  why:`Some owners report a false error message and want to know about service.`,
  say:`Tank aur filter saaf rakhne se aisa kam hota hai. Phir bhi problem aaye toh warranty mein service ka process main aapko saaf bata deta hoon.`,
  care:`Some online owners report a false "tank empty" error. Do not say it never happens. Service goes through Vijay Sales or the website, as there are no service centres.`}
 ]},
{id:'flex',brand:'Shark',name:`Shark FlexBreeze fan`,sub:`Cordless fan that converts from pedestal to portable`,
 facts:[`A BLDC (brushless) motor: it runs quieter and draws less power`,`Remote with a timer. It stores on the fan with a magnet`,`IPX4 and UV resistant. Handles splashes and light rain, not heavy rain`,`Speed 1 runs about 24 hours, speed 3 about 6 hours, speed 5 about 2 hours. 5 hours to charge, and it works while charging`,`37.5 dB, for work and sleep (APEX training)`,`The pack and website say air throw "up to 70 feet". The Singapore page footnotes the figure as measured at fan speed 1 without oscillation. Confirm the India wording`,`Confirm price`],confirm:true,
 qs:[
 {q:`Box pe 70 feet likha hai. Kitni door tak jaata hai?`,g:`Claim on the pack. Shoppers test it.`,
  why:`A large number on the box invites a literal question.`,
  say:`Box pe jo number hai wo ek khaas condition mein naapa gaya hai. Aapka kamra kitna bada hai? Main aapko wahi dikha deta hoon.`,
  care:`Confirm the India footnote first. If it matches the Singapore page, say the speed and oscillation condition out loud. Do not add your own distances.`},
 {q:`BLDC motor kya hota hai? Isse kya fayda?`,g:`BLDC motor. The key technology point.`,
  why:`Shoppers see BLDC on the box and do not know what it means.`,
  say:`BLDC matlab brushless motor. Iska fayda do hain: awaaz kam aati hai aur bijli kam khaata hai. Aap raat ko ya kaam karte waqt chalaoge?`,
  care:`Say quieter and less power. Do not promise a bill amount. The training lists 37.5 dB.`},
 {q:`Isme remote hai kya?`,g:`Remote.`,
  why:`Shoppers want to control a fan from the bed or sofa.`,
  say:`Haan, remote hai, timer ke saath. Fan par magnet se chipak jaata hai, toh kho nahi jaata. Main yahin dikhata hoon.`,
  care:`Training: remote with timer and magnetic storage.`},
 {q:`Baarish mein ya balcony par chalega?`,g:`Rain resistance.`,
  why:`Balcony and terrace use is a main reason to buy a portable fan.`,
  say:`IPX4 hai, matlab paani ke chheente se bachav. Balcony par halki baarish ke chheente mein chalega, par tez baarish mein nahi. UV resistant bhi hai, toh dhoop mein theek rehta hai.`,
  care:`IPX4 means splash protection. Do not say waterproof. Not for heavy rain, and do not charge it in the rain.`},
 {q:`Battery kitni der chalti hai? Power cut mein chalega?`,g:`Battery and power cuts.`,
  why:`Power-cut areas are a core use case.`,
  say:`Sabse dheemi speed par lagbhag 24 ghante, speed 3 par lagbhag 6 ghante aur speed 5 par lagbhag 2 ghante. Charge hone mein 5 ghante lagte hain, aur charging ke dauraan bhi chalta hai.`,
  care:`Run time falls on higher speeds, so always say the speed with the hours. Training: 24 h, 6 h and 2 h.`},
 {q:`Raat ko awaaz kitni hai?`,g:`Noise.`,
  why:`Shoppers want it for sleeping.`,
  say:`Training ke hisaab se lagbhag 37.5 dB hai, kaam aur neend dono ke liye kaafi shaant. BLDC motor ki wajah se. Main chala ke dikhata hoon.`,
  care:`Say about, and offer a demo. The figure is from the training deck.`},
 {q:`Kitni door tak hawa jaati hai?`,g:`Air reach.`,
  why:`The box says 70 feet and the training says the breeze reaches 20 m.`,
  say:`Training ke hisaab se 20 meter door tak hawa mehsoos hoti hai. Box ka 70 feet ek khaas condition mein naapa gaya hai. Aapka kamra kitna bada hai? Main door se chala ke dikhata hoon.`,
  care:`Confirm the India footnote for 70 ft. Do not add your own distances. Offer the demo from a distance, as the trainer suggests.`},
 {q:`Kis direction mein ghoomta hai?`,g:`Oscillation and tilt.`,
  why:`Shoppers want air to reach every corner.`,
  say:`45, 90 ya 180 degree ghoomta hai aur 10 tilt angle hain. Upar-neeche 55 degree tak tilt hota hai.`,
  care:`Training lists 45, 90 and 180 degrees, 10 tilt angles and 55 degrees of vertical tilt.`},
 {q:`Kitna bhaari hai? Utha ke le ja sakte hain?`,g:`Weight and portability.`,
  why:`Portable is the whole point, so weight matters.`,
  say:`Lagbhag 5.6 kg hai. Pedestal se portable aur table-top mein seconds mein badal jaata hai. Main yahin convert karke dikhata hoon.`,
  care:`Training: 5.6 kg, pedestal about 34 inches, tabletop about 15.75 inches.`},
 {q:`Battery kitni bachi hai kaise pata chalega?`,g:`Battery light.`,
  why:`Shoppers do not want the fan to stop without warning.`,
  say:`Light ka rang batata hai: safed poora charge, hara 51 se 99%, amber 21 se 50%, laal 6 se 20%, aur blink karta laal 5% se kam.`,
  care:`Colours are from the training deck. Check them on the real unit before the demo.`},
 {q:`Normal pedestal fan se ye alag kyun?`,g:`Versus a normal fan.`,
  why:`A normal fan costs less, so shoppers ask what the extra is for.`,
  say:`Ye cordless hai, toh power cut mein bhi chalta hai. Pedestal se portable aur table-top mein badal jaata hai, aur BLDC motor se awaaz kam aur bijli kam. Aap kahan chalaoge, kitchen, balcony ya bedroom? Price main confirm karke bata deta hoon.`,
  care:`Do not run down normal fans. Match the benefit to where they will use it. Confirm price.`},
 {q:`Warranty kitni hai?`,g:`Warranty.`,
  why:`Shoppers worry about a battery fan failing early.`,
  say:`Training ke hisaab se 2 saal ki warranty hai, aur dismantle karne ke liye Allen key saath aati hai. Main approved sheet se confirm kar leta hoon.`,
  care:`Warranty is from the training deck. Confirm the India wording.`}
 ]},
{id:'combi',brand:'Ninja',name:`Ninja Combi`,sub:`14-in-1, cooks 2 to 3 dishes at once`,
 facts:[`14 functions in one unit`,`Cooks a main and two sides together`,`12.5 L capacity; retail listings say it suits family meals for up to 8`,`Retail listings call the cavity stainless steel, while shoppers say it looks plastic. Confirm which parts are which`,`Most shoppers do not ask for it by name; promoters usually start the conversation`],confirm:true,
 qs:[
 {q:`Andar se chhota lagta hai.`,g:`Capacity. 12.5L looks smaller than it is.`,
  why:`Combi's cavity is wide and shallow like an oven, so the 12.5 L is not obvious by looking.`,
  say:`Dikhne mein chhota lagta hai par 12.5 litre hai. Ghar mein kitne log khaate hain? Main aapko wahi dish rakh ke dikhata hoon jo aap roz banate ho.`,
  care:`Do not argue with how it looks. Show a real dish in it.`},
 {q:`Philips wale bol rahe the ye European design hai, Indian khana nahi banta.`,g:`Indian cooking fit. Philips promoters say this actively.`,
  why:`Shoppers then ask about stirring with a spatula and cooking Indian food properly.`,
  say:`Dono alag tarah ke hain. OneChef ek pot-style cooker hai, kadhai jaisa. Combi ek multi-level steam oven hai, jisme main aur sides ek saath ban jaate hain. Aap roz kaisa khana banate ho?`,
  care:`Never run down Philips. OneChef suits kadhai and curry-style cooking. Combi suits a multi-part meal finished together. Demo a real Indian dish and be honest about stirring room and tray shape.`},
 {q:`Andar plastic kyun hai, steel kyun nahi?`,g:`Interior material. Competitors use steel.`,
  why:`Shoppers say Combi looks plastic inside and worry about heat and durability. Retail listings describe a stainless steel cavity.`,
  say:`Achha sawal hai. Andar ka cavity aur baaki parts kis material ke hain, ye main approved jaankari se bata deta hoon.`,
  care:`Confirm with the product team which parts are steel and which are plastic, then say it plainly. Do not guess in either direction.`},
 {q:`Veg aur non-veg alag ban sakta hai?`,g:`Separation. Common in Indian homes.`,
  why:`Shoppers ask this before they trust a multi-dish cooker.`,
  say:`Do-teen dish ek saath ban sakti hain. Aapke ghar mein veg-non-veg alag rakhna zaroori hai? Main dikhata hoon tray kaise lagti hain.`,
  care:`Confirm how trays keep dishes separate before you promise it.`},
 {q:`Extra tray ya grid alag se mil jayegi?`,g:`Accessories. Shoppers want spares.`,
  why:`No accessory purchase option exists on the website today.`,
  say:`Abhi website pe alag se tray nahi mil rahi. Ye hum aage ke liye note kar rahe hain.`,
  care:`Accessory sales are being explored. Do not promise a date.`},
 {q:`Isme app ya recipe book hai? Philips mein hai.`,g:`Recipes and app. Indian recipes especially.`,
  why:`Philips has an app and LG buyers get 600+ recipes, so shoppers expect the same.`,
  say:`Indian recipes ki demand hai, ye hum note kar rahe hain. Jo recipes abhi available hain wo main aapko dikhata hoon.`,
  care:`Confirm what recipe content exists today before promising any.`},
 {q:`Chawal aur pasta bina ubaale bante hain?`,g:`Rice and pasta.`,
  why:`Shoppers want fewer pots to manage.`,
  say:`Haan, Rice/Pasta mode mein na pehle ubaalna, na paani nikaalna. Main ek baar chala ke dikhata hoon.`,
  care:`Training lists no drain and no pre-boil. Show a demo before you promise results for every kind of rice.`},
 {q:`Idli aur dhokla ho jaate hain?`,g:`Steam.`,
  why:`Steaming is a daily need in many homes.`,
  say:`Steam mode naazuk cheezon ke liye hai, jaise idli aur dhokla. Aap roz kya steam karte ho?`,
  care:`Training names idli and dhokla. Do not promise a result for every recipe.`},
 {q:`Cake ya cookies ban jaate hain?`,g:`Baking.`,
  why:`Shoppers compare it with an OTG.`,
  say:`Haan, Combi Bake mein jaldi cake ban jaata hai, aur Bake mode mein cookies jaisi oven wali cheezein. Aap kya bake karte ho?`,
  care:`Training: Combi Bake for quick cakes, Bake for cookies. Do not promise every oven recipe.`},
 {q:`Kitna garam hota hai?`,g:`Temperature range.`,
  why:`Shoppers compare it with an OTG and an air fryer.`,
  say:`40 se 240 degree tak. Dheemi pakai se lekar crispy tak sab ho jaata hai.`,
  care:`Range is from the training deck.`},
 {q:`Andar ka coating safe hai? Chemical toh nahi?`,g:`Coating safety.`,
  why:`Families who cook daily worry about non-stick coatings.`,
  say:`Pan par safe nano-ceramic coating hai, jisme PTFE aur PFOA nahi hai. Aap zyada kya pakate ho?`,
  care:`Say "no PTFE, no PFOA". Do not say chemical-free or 100% safe.`},
 {q:`Naram aur kurkura ek saath kaise?`,g:`Technology.`,
  why:`Shoppers do not see how one machine does both.`,
  say:`HyperSteam bhaap aur garam hawa dono chalata hai, isliye ek hi cycle mein ek cheez naram aur ek kurkuri ban sakti hai.`,
  care:`Training says no other brand offers moist and dry cooking. Do not repeat "no other brand" unless it is approved.`},
 {q:`Philips OneChef sasta hai aur 33-in-1 hai. Isme kya extra hai?`,g:`Price and functions vs OneChef.`,
  why:`OneChef is cheaper and lists more functions. The real difference is how each one cooks. Confirm price before you compare.`,
  say:`Dono alag tarah ke hain. OneChef ek single pot hai, toh dishes ek ke baad ek banti hain. Combi mein do level hain, toh main aur sides ek saath ban jaate hain, ye ek countertop steam-oven jaisa hai. Aap ek baar mein kitni dishes banate ho?`,
  care:`OneChef's inner pot has a non-stick coating. Do not run it down. Its pot-style design suits kadhai and curry cooking. Compare on cooking style and how many dishes the shopper cooks at once, not on function count or price.`},
 {q:`Dal, rajma aur pressure cooker wala khana ban jaata hai? Pressure cooker ki jagah?`,g:`Pressure cooker replacement.`,
  why:`Indian shoppers often ask if a multicooker replaces the pressure cooker. Online owners point out Combi steams but is not a pressure cooker.`,
  say:`Ye pressure cooker ki jagah nahi hai. Isme steam aur slow cook hai, toh cheezein alag tarah se banti hain. Aap roz dal-rajma banate ho toh main ek dish yahin check karwa deta hoon.`,
  care:`Do not say Combi is a pressure cooker. Be open about the difference and offer a real dish demo.`},
 {q:`Itne settings hain, use karna mushkil toh nahi?`,g:`Ease of use.`,
  why:`Owners say there is a learning curve with 14 functions.`,
  say:`Presets hain, jaise Combi Meals. Main ek baar ek button se chala ke dikhata hoon, phir aap khud try kijiye.`,
  care:`Do not say there is no learning curve. Hand the machine to the shopper, as the trainer suggests.`},
 {q:`Pizza ban jaata hai kya?`,g:`Pizza.`,
  why:`A common treat for the family.`,
  say:`Haan, Pizza function hai. Aap kaisa pizza banate ho, ghar ka base ya ready base?`,
  care:`Pizza is one of the 14 functions. Do not promise a restaurant-style result.`},
 {q:`Saaf karna kaisa hai? Dishwasher mein jaata hai?`,g:`Cleaning.`,
  why:`Cleaning effort decides whether the machine gets used.`,
  say:`Pan aur tray alag nikalte hain, toh saaf karna aasan hai. Dishwasher mein jaata hai ya nahi, main approved sheet se confirm karke bataunga.`,
  care:`Dishwasher safety for India is not confirmed here. The US page says accessories are dishwasher safe. Confirm before you say yes.`},
 {q:`Kya ye OTG ya oven ki jagah le sakta hai?`,g:`Replace OTG or oven.`,
  why:`Shoppers with limited counter space ask this first.`,
  say:`Training ke hisaab se Combi oven, air fryer aur steamer ka kaam karta hai. Aap roz oven mein kya banate ho? Main wahi dish check karwa deta hoon.`,
  care:`Do not say it replaces a full-size oven. Say it can do many of the same jobs, and test their main dish.`}
 ]},
{id:'crispy',brand:'Ninja',name:`Ninja Crispi`,sub:`Glass-container air fryer`,
 facts:[`Two glass containers: 1.4 L and 3.8 L`,`Four functions: Air Fry, Roast, Recrisp, Keep Warm. No separate Bake or Grill setting, but cakes can be made on Air Fry`,`Food can be stored in the glass container in the fridge and heated directly in the fryer`,`Confirm price`,`Philips NA231 has a dedicated bake and grill setting and a 6.2 L basket`],confirm:true,
 qs:[
 {q:`Itne paise mein baking aur grilling nahi hai?`,g:`Price vs Philips NA231.`,
  why:`The competitor offers a bigger basket and a dedicated bake and grill setting for less money.`,
  say:`Crispi mein do container hain, chhota aur bada, aur khana fridge se nikal ke seedha garam kar sakte ho. Cake bhi Air Fry mode mein ban jaata hai. Aap kitne log ke liye banate ho, aur kya banate ho?`,
  care:`Confirm price before you compare. Lead with the two containers and fridge-to-fryer. Say cakes can be made on Air Fry. Do not say Crispi has a Bake setting. Confirm cake guidance with the product team. If they need a big daily bake or grill, show Combi.`},
 {q:`Kitne log ke liye kaafi hai?`,g:`Capacity.`,
  why:`Shoppers judge by their family size.`,
  say:`Bada 3.8 litre container 4 log tak ke liye hai, jaise 4 chicken breast ya 600 gram fries. Chhota 1.4 litre container 1 ya 2 logon ke 7 minute ke khane ke liye hai. Aapke ghar mein kitne log?`,
  care:`Training: 3.8 L feeds up to 4. 1.4 L is for small 7-minute meals. Do not go beyond these.`},
 {q:`Table par seedha serve kar sakte hain?`,g:`Serving.`,
  why:`Shoppers want fewer dishes.`,
  say:`Haan, container ke heat-resistant feet hain, toh table kharab nahi hota. Banao, serve karo aur wahin rakh do.`,
  care:`Training lists heat-resistant feet. Do not promise it for every surface.`},
 {q:`Microwave mein jaata hai?`,g:`Microwave use.`,
  why:`Many homes reheat in the microwave.`,
  say:`Containers aur lids microwave safe hain. Fridge se nikaalo, microwave ya Crispi mein garam karo.`,
  care:`Training: containers and lids are microwave safe.`},
 {q:`Bartan kam kaise honge?`,g:`Washing up.`,
  why:`Dishes are the main complaint after cooking.`,
  say:`Aam taur par 3 bartan lagte hain. Isme marinate, pakao, serve aur store ek hi container mein, toh ek hi bartan dhona padta hai.`,
  care:`Training: reduces 3 dirty dishes per meal to 1.`},
 {q:`Marinate karke freeze kar sakte hain?`,g:`Prep ahead.`,
  why:`Busy households prepare ahead.`,
  say:`Haan, marinate karo, freeze karo aur seedha air fry karo. Glass thermal-shock resistant hai.`,
  care:`Training lists -5 to 240°C. Do not say it cannot break. Confirm the low end with the trainer.`},
 {q:`Khana toh plate par rehta hai, glass ka kya fayda?`,g:`Glass vs tray. A common doubt online.`,
  why:`Shoppers notice that food sits on the crisper plate, not on the glass.`,
  say:`Sahi baat hai, khana crisper plate par rehta hai. Glass ka fayda ye hai ki saaf karna aasan hai, andar khana dikhta hai, aur wahi container fridge mein rakh ke seedha garam kar sakte ho.`,
  care:`Do not say food touches only glass. Say the container is glass and name the real benefits: easy cleaning, see-through, fridge to fryer. The crisper plate is a separate tray, so do not say there is no coating anywhere.`},
 {q:`Online log kehte hain Crispi der se pakata hai.`,g:`Cooking speed.`,
  why:`Some owners compare it with basket air fryers and feel it is slower.`,
  say:`Time khane aur quantity par depend karta hai. Main yahin ek dish bana ke dikhata hoon, aap khud dekh lijiye.`,
  care:`Do not claim it is faster than other air fryers. Offer a demo. Do not promise exact times.`},
 {q:`Halki cheezein jaise papad ya bread udd jaati hain?`,g:`Light foods moving.`,
  why:`Online owners say the fan can move light foods such as bacon or tortillas.`,
  say:`Tez hawa se halki cheezein hil sakti hain. Aap kya banate ho? Main dikhata hoon kaise rakhna hai.`,
  care:`Do not promise light foods stay still. Confirm tips with the trainer.`},
 {q:`Bahar se steel ka rack laga sakte hain?`,g:`Third-party racks.`,
  why:`Shoppers want a steel option instead of the tray.`,
  say:`Company ke diye hue accessories hi use kijiye. Bahar ke rack se glass par dabav aa sakta hai.`,
  care:`Online posts report glass cracking with some third-party racks. Advise only the included accessories.`},
 {q:`Extra container alag se mil sakta hai?`,g:`Spare containers.`,
  why:`Shoppers want a second container for meal prep.`,
  say:`India mein alag se container milta hai ya nahi, main confirm karke bataunga. Aapko meal prep ke liye chahiye?`,
  care:`Not confirmed for India. Do not promise a date or a price. Log the request in the Log tab.`},
 {q:`Saaf kaise karte hain? Dishwasher mein jaata hai?`,g:`Cleaning.`,
  why:`Easy cleaning is one of the reasons shoppers choose glass.`,
  say:`Glass hone se saaf karna aasan hai. Dishwasher safe hai ya nahi, main approved sheet se confirm karke bataunga.`,
  care:`Dishwasher safety for India is not confirmed. Confirm before you say yes.`},
 {q:`Crispi lun ya Max Pro?`,g:`Choosing within Ninja.`,
  why:`Shoppers see two Ninja air fryers at different prices.`,
  say:`Crispi glass container, chhote aur bade batch aur fridge se seedha garam karne ke liye hai. Max Pro 6.2 litre ka single basket hai, jisme Bake aur Dehydrate bhi hai. Aap kitne log ke liye banate ho?`,
  care:`Max Pro: 6.2 L, 2,000 W, six functions including Bake and Dehydrate (APEX). Crispi: four functions. Match the need, not the price.`}
 ]},
{id:'maxpro',brand:'Ninja',name:`Ninja Max Pro`,sub:`6.2 L air fryer`,
 facts:[`6.2 L basket, 2,000 W`,`Six functions: Air Fry, Max Crisp, Roast, Bake, Reheat, Dehydrate`,`No window is listed; shoppers ask for one`],confirm:true,
 qs:[
 {q:`Andar khana dikh sakta hai kya?`,g:`See-through window.`,
  why:`Shoppers want to watch food while it cooks.`,

{id:'hp300',brand:'Shark',name:`Shark HP300 Air Purifier`,sub:`NeverChange HEPA filter, up to 5 years`,
 facts:[`True HEPA 14 filter listed at 99.98%, tested at 0.1 to 0.2 microns`,`Filter is listed as lasting up to 5 years. That is a tested maximum, not a promise`,`Covers up to 1,400 sq ft in one hour, per the product page`,`Confirm price`,`Purifier only. No humidifier`,`CADR figure for India is not confirmed`],confirm:true,
 qs:[
 {q:`Philips ka filter har saal badalna padta hai. Isme?`,g:`Filter cost. The main reason to pick HP300.`,
  why:`Shoppers compare the sticker price, not the cost of ownership. A yearly filter adds up.`,
  say:`HP300 ka filter 5 saal tak chalne ke liye test hua hai, toh filter ka kharcha nahi. Aap kitne saal ke liye le rahe ho? Main aapko 5 saal ka hisaab likh ke dikha deta hoon.`,
  care:`Say "up to 5 years", never "never needs changing". Use the filter cost table in Learn and say the Philips price is indicative until confirmed.`},
 {q:`Dyson HushJet mein bhi 5 saal ka filter hai aur woh quiet hai.`,g:`Competitor claim. Dyson matches the 5-year filter.`,
  why:`The 5-year filter is not unique to Shark any more. Dyson lists 24 dB in sleep mode.`,
  say:`Sahi baat hai, Dyson bhi 5 saal tak bolta hai. Farak aapke kamre ke size, raat ke shor aur budget mein dekhte hain. Aapka bedroom kitna bada hai?`,
  care:`Do not say Dyson is more expensive. Confirm both prices before you compare. Do not deny that Dyson is quieter in sleep mode.`},
 {q:`1,400 sq ft kya sach mein? Mera hall itna bada nahi.`,g:`Coverage claim. Shoppers test it against their own room.`,
  why:`A big number invites doubt. The figure is for one hour under test conditions.`,
  say:`Ye company ka tested figure hai, ek ghante ke liye. Aapka kamra kitna bada hai? Chhote kamre mein aur jaldi saaf hoga, wahi main aapko dikhata hoon.`,
  care:`Do not promise that a whole home is clean in an hour. State the one-hour test condition.`},
 {q:`Philips mein humidifier bhi hai. Isme?`,g:`Features. Philips 3400 is a 2-in-1.`,
  why:`Dry-climate and winter buyers like a humidifier in the same unit.`,
  say:`HP300 sirf purifier hai, humidifier nahi hai. Aapke ghar mein hawa sookhi lagti hai ya dhool aur smoke ka problem zyada hai?`,
  care:`Do not say HP300 humidifies. Do not say humidifiers are not needed.`},
 {q:`Raat ko kitni awaaz karta hai?`,g:`Noise. Bedroom use.`,
  why:`Most purifiers run at night. Dyson advertises 24 dB in sleep mode.`,
  say:`Sabse dheemi speed pe lagbhag 39 dB hai aur sabse tez pe 62 dB tak jaata hai. Main sleep mode yahin chala ke dikhata hoon, aap khud suniye.`,
  care:`Training lists 39 dB to 62 dB across 5 fan speeds. Dyson lists 24 dB in sleep mode, so do not call HP300 the quietest.`},
 {q:`Filter badalne ka kaise pata chalega?`,g:`Filter indicator.`,
  why:`Shoppers worry that a purifier fails silently.`,
  say:`Display par HALO light hai. Neela matlab 100%, amber 70% aur laal 40%. Main yahin dikha deta hoon.`,
  care:`Training lists the HALO colours as blue 100%, amber 70%, red 40%. Confirm what the percentage measures before you explain it.`},
 {q:`Khana pakane ki badbu aur dhuan jaayega?`,g:`Cooking smell and smoke.`,
  why:`Indian homes have strong cooking smells, and many shoppers buy for fumes.`,
  say:`Isme activated carbon filter hai jo gas aur badbu pakadta hai, aur Indian gharon ke liye odor neutralizer puck bhi hai. Aapka kitchen khula hai ya band?`,
  care:`Say it helps with smells and fumes. Do not promise that every smell disappears.`},
 {q:`Pet ke baal aur dhool ka kya?`,g:`Pet hair.`,
  why:`Pet owners worry about a clogged filter.`,
  say:`Pehle ek debris layer baal aur dhool rok leti hai, jise aap vacuum ya dho sakte ho. Uske baad HEPA filter aata hai. Ghar mein pet hai?`,
  care:`The external debris filter is cleaned by the owner. Do not say the machine needs no upkeep.`},
 {q:`Filter par kitna paisa bachega?`,g:`Savings. The question behind most purifier decisions.`,
  why:`The training pitch is saving on filter maintenance. Shoppers want a number.`,
  say:`Aap kitne saal ke liye le rahe ho? Main 5 saal ka filter kharcha likh ke dikhata hoon, saalana filter wali machine ke saath.`,
  care:`Figures differ. The training deck gives one saving and a retailer page gives a lower one. Ask the trainer which competitor and period the deck figure uses before you quote any amount. Confirm price.`},
 {q:`CADR kitna hai? Online dhoondha toh nahi mila.`,g:`CADR. Shoppers say it is not published.`,
  why:`CADR is the standard way to compare purifiers. Shoppers who research online notice when it is missing.`,
  say:`Mujhe India ka CADR figure abhi confirm nahi hai, toh main galat number nahi bolunga. Jo main bata sakta hoon wo hai ki 1,400 sq ft ka claim ek ghante ke tested figure par hai. Aapka kamra kitna bada hai?`,
  care:`Do not invent a CADR. Some online posts quote a US smoke CADR near 204 CFM. Treat it as unverified until the product team confirms.`},
 {q:`1,400 sq ft ka matlab ek ghante mein ek baar hawa badalna hai na?`,g:`Coverage claim, in detail.`,
  why:`Informed shoppers say the claim is about one air change an hour, which is slow for heavy pollution.`,
  say:`Claim ek ghante ke tested figure par hai. Zyada AQI mein chhote kamre ke liye chalana behtar rahega. Aapka bedroom kitna bada hai aur AQI kaisa rehta hai?`,
  care:`Do not say 1,400 sq ft is for heavy pollution. Match the room size and AQI to the machine. Be open that smaller rooms clean faster.`},
 {q:`Display hamesha 100% kyun dikhata hai? Auto mode mein band rehta hai.`,g:`Sensor and auto mode.`,
  why:`Online owners say auto mode can leave the machine idle when the sensor reads clean air.`,
  say:`Auto mode hawa saaf hone par speed kam kar deta hai ya rok deta hai. Agar aap chahte ho ki hamesha chalta rahe, toh manual speed laga sakte ho. Main yahin dikha deta hoon.`,
  care:`Online posts also question the display accuracy. Do not say the sensor is perfect. Offer manual speeds. Confirm auto mode behaviour with the trainer.`},
 {q:`Coway ya kisi aur brand ka CADR zyada hai. Aap kyun?`,g:`Competitor claim.`,
  why:`Informed shoppers compare CADR, price and filter cost.`,
  say:`Aap sahi compare kar rahe ho. HP300 ka fayda 5 saal ke filter aur kam filter kharche mein hai. CADR ka figure main confirm karke bataunga. Aapka bedroom kitna bada hai?`,
  care:`Do not run down other brands. Do not claim the best CADR. Lead with the five-year cost and match the machine to the room.`},
 {q:`Kya 5 saal ka filter sach mein chalega? Online log galat bolte hain.`,g:`Filter life claim.`,
  why:`Some online owners doubt the 5-year claim, or say it only holds if the machine runs less.`,
  say:`5 saal tak tested maximum hai. Asli life aapke ghar ki hawa aur use par depend karti hai. Isliye filter indicator bhi hai.`,
  care:`Say "up to 5 years" and "depends on use and air quality". Never say it never needs changing.`},
 {q:`Bijli kitni khaati hai?`,g:`Running cost.`,
  why:`Purifiers run for many hours a day.`,
  say:`Lagbhag 54 watt hai. Rozana kitne ghante chalayenge, uske hisaab se hisaab laga lete hain.`,
  care:`54 W is from the training and a retailer page. Do not promise a bill amount.`}
 ]},
{id:'any',brand:'Both',name:`Every product: price, EMI, service`,sub:`The questions a pitch cannot fix`,

  say:`Ninja ke pack par air fryer brand mein World's No.1 likha hai. Main product chala ke dikhata hoon aur warranty ke baare mein saaf bata deta hoon.`,
  care:`Quote the pack wording only and add no numbers. Confirm what the claim is based on. Be open about service.`}
 ]}

var DRILLS=[
{p:'combi',topic:`Price vs Philips`,q:`Philips OneChef sasta hai aur 33-in-1 hai. Isme kya extra hai?`,

 {t:`Haan OneChef sasta hai, wahi le lo.`,v:'ok',f:`Honest about price, but you gave up without asking what they need.`}],
 why:`Confirm price before you compare. It comes down to cooking style. OneChef is a pot-style cooker that suits kadhai and curry cooking, one dish after another. Combi is a multi-level steam oven that cooks a main and sides together. Do not argue on price or function count. Ask how many dishes they cook at once.`},

{p:'combi',topic:`Why so expensive`,q:`Itna mehnga kyun?`,

 {t:`Main manager se baat karke discount dila dunga.`,v:'risk',f:`You invented an offer you cannot confirm.`},
 {t:`Quality ki wajah se.`,v:'ok',f:`Honest but empty. It gives the shopper nothing to weigh.`}],

{p:'combi',topic:`Veg and non-veg`,q:`Veg aur non-veg alag ban sakta hai ek saath?`,

 {t:`Philips bada hai aur bake-grill karta hai, ye sach hai. Crispi mein do container hain, chhota aur bada, aur khana fridge se seedha garam ho jaata hai. Cake bhi Air Fry mein ban jaata hai. Aap kitne log ke liye banate ho?`,v:'best',f:`Honest about their strengths, leads with what Crispi does well, and asks what the shopper needs.`},

{p:'crispi',topic:`Baking and grilling`,q:`Isme cake ya grill ho sakta hai?`,

/* ---------- POINTS ---------- */
function nkey(n){return String(n||'').trim().toLowerCase()}
function dayStr(ts){var d=new Date(ts);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function weekStart(){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}
function scoreAll(){
  var R=allRecs().filter(function(r){return r&&r.name}).slice().sort(function(a,b){return (a.ts||0)-(b.ts||0)});
  var by={},cnt={},seen={},ws=weekStart(),today=dayStr(Date.now());
  R.forEach(function(r){
    var k=nkey(r.name);if(!k)return;
    var u=by[k]||(by[k]={name:r.name,store:r.store||'',pts:0,week:0,logs:0,logsToday:0,days:{}});
    var d=dayStr(r.ts||0),ck=k+'|'+d+'|'+r.type,pts=0;
    cnt[ck]=(cnt[ck]||0)+1;
    if(r.type==='real'){
      if(cnt[ck]<=10)pts=10+(String(r.text||'').length>=20?5:0);
      u.logs++;if(d===today)u.logsToday++;u.days[d]=1;
    }else if(r.type==='practice'){if(cnt[ck]<=3)pts=5}
    else if(r.type==='drill'){var sk=k+'|'+r.dk;if(!seen[sk]){seen[sk]=1;pts=2}}
    u.pts+=pts;if((r.ts||0)>=ws)u.week+=pts;
  });
  return by;
}
function myStats(){var by=scoreAll();return by[nkey(S.me.name)]||{name:S.me.name,pts:0,week:0,logs:0,logsToday:0,days:{}}}
function levelOf(p){var i=0;LEVELS.forEach(function(l,j){if(p>=l[0])i=j});return {name:LEVELS[i][1],from:LEVELS[i][0],next:LEVELS[i+1]||null}}
function streakOf(days){var n=0,d=new Date(),today=dayStr(Date.now());for(var g=0;g<400;g++){var s=dayStr(d.getTime());if(days[s]){n++;d.setDate(d.getDate()-1)}else if(n===0&&s===today){d.setDate(d.getDate()-1)}else break}return n}
function updateChip(){
  var c=$('#ptsChip');if(!c)return;
  if(S.me.name){c.textContent=myStats().pts+' pts';c.classList.add('on')}
  else{c.textContent='Get points';c.classList.remove('on')}
}

var SIDX=null;
var SYN={emi:'finance emi cost',finance:'emi finance',service:'service repair kharab center',repair:'service repair kharab',heavy:'weight bhaari',weight:'weight bhaari',bhaari:'weight bhaari',
  price:'price amazon online discount paise',cheaper:'amazon price online',online:'amazon online price',amazon:'amazon online price',plastic:'plastic steel material interior',steel:'plastic steel material',
  battery:'battery run time minute',window:'window see-through glass',tray:'tray grid accessory extra',recipe:'recipe app',demo:'demo',warranty:'warranty accidental damage',
  suction:'air watts suction',watts:'air watts suction',sofa:'sofa curtain attachments',small:'small capacity chhota',
  filter:'filter cost saal purifier',purifier:'purifier hp300 filter hepa',hepa:'hepa filter purifier',noise:'noise awaaz db',humidifier:'humidifier purifier',coverage:'sq ft coverage purifier',dyson:'dyson weight',philips:'philips'};
function buildIdx(){
  SIDX=[];
  PCHIP.forEach(function(c){var p=PRODUCTS.find(function(x){return x.id===PQ_ID[c[0]]});if(!p)return;
    p.qs.forEach(function(q){SIDX.push({p:p.name,q:q.q,g:q.g,why:q.why,say:q.say,care:q.care,h:(p.name+' '+q.q+' '+q.g+' '+q.why+' '+q.say).toLowerCase()})})});
}
function qHtml(q,pn,open){
  return '<details class="q"'+(open?' open':'')+'><summary><b>&ldquo;'+esc(q.q)+'&rdquo;</b><small>'+(pn?esc(pn)+'. ':'')+esc(q.g)+'</small></summary><div class="qb">'
   +'<div><div class="lab">Say it</div><div class="sayline">'+esc(q.say)+'</div></div>'
   +'<div><div class="lab">Be careful</div><div class="care">'+esc(q.care)+'</div></div>'
   +'<div class="why"><b>Why they ask:</b> '+esc(q.why)+'</div></div></details>';
}
function searchHtml(v){
  v=(v||'').trim().toLowerCase();if(!v)return '';
  if(!SIDX)buildIdx();
  var groups=v.split(/\s+/).filter(Boolean).map(function(t){return [t].concat((SYN[t]||'').split(' ').filter(Boolean))});
  var hits=SIDX.map(function(it){var sc=0;groups.forEach(function(g){if(g.some(function(w){return it.h.indexOf(w)>-1}))sc++});return {it:it,sc:sc}}).filter(function(x){return x.sc>0});
  var full=hits.filter(function(x){return x.sc===groups.length});
  var use=(full.length?full:hits).sort(function(a,b){return b.sc-a.sc}).slice(0,6);
  if(!use.length)return '<div class="empty">Nothing matches &ldquo;'+esc(v)+'&rdquo;. Try EMI, weight, service, plastic, filter or battery. Heard something new? <button class="linkish" data-act="tab" data-tab="log">Log it</button></div>';
  return '<div class="inner">'+use.map(function(x,i){return qHtml(x.it,x.it.p,i===0&&use.length===1)}).join('')+'</div>';
}

function boardHtml(){
  var by=scoreAll(),wk=S.board==='week',me=nkey(S.me.name);
  var arr=Object.keys(by).map(function(k){return by[k]}).filter(function(u){return (wk?u.week:u.pts)>0});
  arr.sort(function(a,b){return wk?b.week-a.week:b.pts-a.pts});
  if(!arr.length)return '<div class="empty">No points yet. Log a question to be first on the board.</div>';
  var row=function(u,i){var p=wk?u.week:u.pts,isMe=nkey(u.name)===me;
    return '<div class="lb-row'+(isMe?' me':'')+(i===0?' top1':'')+'"><span class="rk">'+(i+1)+'</span><span><b>'+esc(u.name)+(isMe?' (you)':'')+'</b>'+(u.store?'<small>'+esc(u.store)+'</small>':'')+'</span><span class="pt">'+p+'</span></div>'};
  var top=arr.slice(0,10).map(row).join('');
  var idx=arr.findIndex(function(u){return nkey(u.name)===me});
  if(idx>=10)top+='<div class="lb-row me"><span class="rk">'+(idx+1)+'</span><span><b>'+esc(arr[idx].name)+' (you)</b></span><span class="pt">'+(wk?arr[idx].week:arr[idx].pts)+'</span></div>';
  return top;
}
function topThemes(){
  var ws=weekStart(),counts={};

/* ---------- SHOPPER ---------- */
function shopperPrompt(p,diff){
  var lvl={1:`Friendly: you open up about your home as soon as the promoter asks one sensible question.`,
    2:`Realistic: you answer only what is asked. You reveal your real situation after two sensible open questions about you, not the product.`,
    3:`Tough: you are guarded and in a hurry. If the promoter pitches before asking about you, repeat your main objection. Open up only when asked something that shows they care about your situation. Press on any claim that sounds vague or too good to be true.`}[diff];
  return `You are role-playing a SHOPPER in an Indian electronics retail store so a retail promoter can practise a real conversation. Stay in character at all times and never mention being an AI.\n\n`
   +`Language: natural Hinglish, Hindi written in Roman script mixed with English, the way people actually speak on a shop floor. One to three short sentences per reply. No lists. No stage directions.\n\n`
   +`Who you are: ${p.who}\nStore context: ${p.store}\nYour opening line (already said): ${p.line}\nThings you raise or care about on the surface: ${p.surface.join('; ')}\n`
   +`Your hidden need (never volunteer it; let it out gradually only when the promoter asks about your home, family, routine or what annoys you): ${p.hidden}\n\n`
   +`Difficulty: ${lvl}\n\n`
   +`Behaviour rules:\n- If the promoter lists features without asking about you, get slightly impatient and return to your main objection.\n- If the promoter admits a limitation honestly, trust them more.\n- If the promoter makes a vague or exaggerated claim, push back like a real shopper.\n- If you feel understood and the fit is real, move toward buying: ask to try it, ask about price or how to pay.\n- If you feel pitched at or misled, drift toward leaving or buying online.\n- Never invent specific specs, prices or service facts about SharkNinja products; you are the shopper and you may ask about them. About rival brands speak only in general terms of what shoppers commonly say.\n\n`
   +`Facts the promoter may legitimately know (for reference only, do not recite them):\n${kb()}\n\nReply only as the shopper.`;
}
function buildMsgs(){
  var m=[{role:'user',content:shopperPrompt(S.persona,S.diff)}];
  S.turns.slice(-20).forEach(function(t){m.push({role:t.who==='you'?'user':'assistant',content:t.text})});
  if(m[1]&&m[1].role==='user')m.splice(1,0,{role:'assistant',content:S.persona.line});
  return m;
}
function errCopy(e){
  var c=e&&e.code;
  if(c==='not_granted'){S.ai='off';return `Claude access was declined for this view. Reload and allow it to practise.`}
  if(c==='rate_limited')return `Too many requests at once. Wait a few seconds, then try again.`;
  return `The shopper did not answer.`;
}
async function getReply(){
  S.busy=true;S.lastErr=false;drawThread();setBusy(true);
  ctl=new AbortController();
  try{
    var r=await sampleFn(buildMsgs(),{cache:false,modelTier:'quick',signal:ctl.signal,onText:function(u){var t=$('#typing');if(t){t.classList.remove('wait');t.textContent=u.text}}});
    var txt=String(r.text||'').trim();
    if(!txt)throw {code:'empty'};
    S.turns.push({who:'shopper',text:txt});
    if(S.speak)say(txt);
  }catch(e){
    if(e&&e.code==='cancelled'){}
    else{S.lastErr=errCopy(e)}
  }finally{S.busy=false;setBusy(false);drawThread()}
}
function setBusy(b){var s=$('#sendBtn');if(s)s.disabled=b;var e=$('#endBtn');if(e)e.disabled=b}
async function sendTxt(txt){
  txt=(txt||'').trim();
  if(!txt||S.busy)return;
  if(!sampleFn){toast(`Practice is not available in this view.`);return}
  stopSay();
  S.turns.push({who:'you',text:txt});
  var ta=$('#ta');if(ta){ta.value='';ta.style.height='auto'}
  await getReply();
}

/* ---------- VOICE ---------- */
function say(text){
  try{
    if(!('speechSynthesis' in window))return;
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    var vs=speechSynthesis.getVoices();
    var v=vs.find(function(x){return x.lang==='en-IN'})||vs.find(function(x){return x.lang==='hi-IN'})||null;
    if(v){u.voice=v;u.lang=v.lang}else u.lang='en-IN';
    u.rate=1;speechSynthesis.speak(u);
  }catch(e){}
}
function stopSay(){try{if('speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}}
function stopMic(){try{if(rec)rec.stop()}catch(e){}S.listening=false;var b=$('#micBtn');if(b)b.setAttribute('aria-pressed','false')}
function startMic(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR||S.busy)return;
  var note=$('#micNote'),ta=$('#ta'),btn=$('#micBtn');
  stopSay();micErr='';
  try{
    rec=new SR();rec.lang=S.vlang;rec.interimResults=true;rec.continuous=false;
    var finalT='';
    rec.onresult=function(ev){var t='';for(var i=0;i<ev.results.length;i++){t+=ev.results[i][0].transcript;if(ev.results[i].isFinal)finalT=t}if(ta)ta.value=t};
    rec.onerror=function(ev){
      micErr=(ev.error==='not-allowed'||ev.error==='service-not-allowed')?`Mic is blocked here. Type your reply, or allow the mic for this page.`:`Could not hear that. Try again or type.`;
      if(note)note.textContent=micErr;
    };
    rec.onend=function(){
      S.listening=false;if(btn)btn.setAttribute('aria-pressed','false');
      var t=(ta&&ta.value||'').trim();
      if(t&&!micErr){if(note)note.textContent='';sendTxt(t)}
    };
    rec.start();S.listening=true;btn.setAttribute('aria-pressed','true');if(note)note.textContent=`Listening. Pause when you are done.`;
  }catch(e){if(note)note.textContent=`Voice is not available here. Type your reply.`}
}

/* ---------- COACHING ---------- */
function coachPrompt(){
  var p=S.persona;
  var tr=S.turns.map(function(t){return (t.who==='you'?'PROMOTER: ':'SHOPPER: ')+t.text}).join('\n');
  return `You are a retail sales coach for SharkNinja promoters in India. Coach in plain, warm, direct English. Judge the PROMOTER only. The philosophy: a promoter should be a consumer problem-solver, not a feature-lister. Reward asking before recommending, finding the underlying need, connecting a feature to that specific life, recommending the genuinely right model, and being honest about limits. The house method is APEX: a one-line pitch, a two-way conversation (Question, then Problem, then Compare) rather than a presentation, a product-specific demo trick, and a closing in order (MRP and current price, cost difference today, offer with cost, total savings if bought now, valid till stocks last). Credit these when you see them and note when the promoter skipped the Question step.\n\n`
   +`The shopper persona: ${p.who}\nThe shopper's hidden need (the promoter was not told): ${p.hidden}\nDifficulty level: ${S.diff} of 3\n\n`
   +`Known facts and safe handling (anything the promoter claims beyond this, or that contradicts it, should be flagged for checking):\n${kb()}\n\n`
   +`CONVERSATION:\n${tr}\n\n`
   +`Return ONLY a JSON object with exactly these keys:\n`
   +`{"scores":{"diagnose":{"score":1-5,"note":"one sentence"},"need":{"score":1-5,"note":"one sentence"},"link":{"score":1-5,"note":"one sentence"},"honest":{"score":1-5,"note":"one sentence"}},`
   +`"needFound":true|false,"needNote":"one or two sentences on how the promoter did or did not surface the hidden need",`
   +`"worked":["max 3 specific things, quoting the promoter's own words briefly"],"sharpen":["max 3 specific, actionable improvements"],`
   +`"line":"one stronger line in natural Hinglish (Roman script) the promoter could have said at the key moment",`
   +`"outcome":"would_buy"|"thinking"|"walks",`
   +`"themes":["up to 3 chosen ONLY from this list: ${THEMES.join(' | ')}"],`
   +`"flags":["any claim by the promoter that is not in the known facts, may be unapproved, invents a spec, price, offer or service, or runs down a competitor; empty array if none"]}\n`
   +`Scoring: diagnose = asked about the shopper before pitching; need = surfaced the hidden need; link = tied features to their life rather than listing; honest = admitted limits and made no unsupported claims. Be fair: a short conversation caps what can be shown. Do not praise what did not happen.`;
}
function norm(d){
  var sc={};DIMS.forEach(function(x){var s=(d.scores&&d.scores[x.k])||{};sc[x.k]={score:clamp(s.score),note:String(s.note||'')}});
  var arr=function(a,n){return (Array.isArray(a)?a:[]).slice(0,n).map(String).filter(Boolean)};
  return {scores:sc,needFound:!!d.needFound,needNote:String(d.needNote||''),worked:arr(d.worked,3),sharpen:arr(d.sharpen,3),line:String(d.line||''),
    outcome:({would_buy:1,thinking:1,walks:1}[d.outcome]?d.outcome:'thinking'),themes:arr(d.themes,3).filter(function(t){return THEMES.indexOf(t)>-1}),flags:arr(d.flags,4)};
}
async function runCoach(){
  S.coaching=true;S.coachErr=null;S.debrief=null;S.saved=false;render();
  try{
    var raw=await sampleFn.json(coachPrompt(),{modelTier:'default',cache:false});
    S.debrief=norm(raw||{});
    if(!S.saved){
      S.saved=true;
      var r=S.debrief;
      saveRec({type:'practice',persona:S.persona.id,cat:S.persona.cat,diff:S.diff,outcome:r.outcome,
        scores:{diagnose:r.scores.diagnose.score,need:r.scores.need.score,link:r.scores.link.score,honest:r.scores.honest.score},themes:r.themes});
    }
  }catch(e){
    S.coachErr=(e&&e.code==='not_granted')?`Claude access was declined for this view.`:(e&&e.code==='rate_limited')?`Too many requests at once. Wait a few seconds and try again.`:`Something went wrong reading the conversation. Your practice chat is still here.`;
  }
  S.coaching=false;
  if(S.tab==='practice'&&S.view==='debrief')render();
}
function saveRec(r){
  r.ts=Date.now();r.name=S.me.name||'';r.store=S.me.store||'';
  S.hist.push(r);
  try{localStorage.setItem('fr_hist',JSON.stringify(S.hist.slice(-200)))}catch(e){}
  if(dbRef){try{dbRef.collection('sessions').add(r).catch(function(){})}catch(e){}}
}


/* ---------- ACTIONS ---------- */
function startSession(id){
  S.tab='practice';S.pmode='chat';
  S.persona=PERSONAS.find(function(p){return p.id===id});if(!S.persona)return;
  S.turns=[{who:'shopper',text:S.persona.line}];S.view='session';S.busy=false;S.lastErr=false;S.debrief=null;S.saved=false;micErr='';
  render();if(S.speak)say(S.persona.line);
}
function needName(){
  if(S.me.name)return false;
  S.tab='log';render();var n=$('#meName');if(n)n.focus();
  toast('Add your name first to collect points');return true;
}
var KEEP=['dpick','dretry','yrs','cmp','pp','pmode','didx','lcat','lseg','board','diff'];
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act;S.keep=KEEP.indexOf(a)>-1;
  switch(a){
    case 'tab':S.tab=t.dataset.tab;if(S.tab==='practice'&&S.view==='debrief'&&!S.coaching)S.view='home';render();break;
    case 'chip':var qi=$('#q');if(qi){qi.value=t.dataset.q;$('#sres').innerHTML=searchHtml(qi.value);qi.focus()}break;
    case 'pmode':S.pmode=t.dataset.k;render();break;
    case 'pp':S.pp=t.dataset.p;S.didx=0;S.dpick=null;S.pq='';render();break;
    case 'diff':S.diff=+t.dataset.n;render();break;
    case 'didx':S.didx=+t.dataset.i;S.dpick=null;render();break;
    case 'dpick':
      var dl=drillsFor(S.pp),dd=dl[S.didx];S.dpick=+t.dataset.i;
      var dk=S.pp+':'+S.didx,v=dd.opts[S.dpick].v,prev=S.dscore[dk];
      S.dscore[dk]=v;
      if(v==='best'&&!prev){
        if(S.me.name){saveRec({type:'drill',dk:dk,product:S.pp,topic:dd.topic});toast('+2 points')}
        else toast('Add your name in Log to collect points')
      }
      render();var fbe=$('.fb');if(fbe)fbe.scrollIntoView({block:'nearest'});break;
    case 'dnext':S.didx=(S.didx+1)%drillsFor(S.pp).length;S.dpick=null;render();break;
    case 'dretry':S.dpick=null;delete S.dscore[S.pp+':'+S.didx];delete S.dord[S.pp+':'+S.didx];render();break;
    case 'start':if(S.ai==='off'){S.pmode='drills';render();toast('Live chat runs only inside Claude. Here are drills instead.');break}startSession(t.dataset.id);break;
    case 'learnprac':S.tab='practice';S.pmode='drills';S.pp=t.dataset.p;S.didx=0;S.dpick=null;S.view='home';render();break;
    case 'leave':stopSay();stopMic();if(ctl)try{ctl.abort()}catch(x){}S.view='home';S.busy=false;render();break;
    case 'speak':S.speak=!S.speak;t.setAttribute('aria-pressed',String(S.speak));if(!S.speak)stopSay();break;
    case 'send':sendTxt($('#ta').value);break;
    case 'retry':getReply();break;
    case 'mic':if(S.listening)stopMic();else startMic();break;
    case 'vlang':S.vlang=S.vlang==='en-IN'?'hi-IN':'en-IN';t.textContent='Voice: '+(S.vlang==='en-IN'?'English / Hinglish':'Hindi');break;
    case 'hint':var ta=$('#ta');if(ta){ta.value=HINTS[Math.floor(Math.random()*HINTS.length)];ta.focus()}break;
    case 'end':
      var n=S.turns.filter(function(x){return x.who==='you'}).length;
      if(n<2){toast('Say a bit more first. Coaching needs two replies from you.');break}
      stopSay();stopMic();S.view='debrief';runCoach();break;
    case 'recoach':runCoach();break;
    case 'again':startSession(S.persona.id);break;
    case 'lcat':S.lcat=t.dataset.c;render();break;
    case 'lseg':S.lseg=t.dataset.k;render();break;
    case 'cmp':S.cmp=t.dataset.k;render();break;
    case 'yrs':S.yrs=+t.dataset.y;render();break;
    case 'board':S.board=t.dataset.k;render();break;
    case 'saveme':
      var nm=($('#meName').value||'').trim().slice(0,40),st=($('#meStore').value||'').trim().slice(0,40);
      if(nm.length<2){toast('Enter your name');break}
      S.me={name:nm,store:st};try{localStorage.setItem('fr_me',JSON.stringify(S.me))}catch(x){}
      toast('Saved. Start logging!');render();break;
    case 'editme':S.me={name:'',store:S.me.store};render();var mn=$('#meName');if(mn)mn.focus();break;
    case 'lgprod':S.lgProd=t.dataset.p;document.querySelectorAll('[data-act="lgprod"]').forEach(function(b){b.setAttribute('aria-pressed',String(b===t))});break;
    case 'lgres':S.lgRes=(S.lgRes===t.dataset.r?'':t.dataset.r);document.querySelectorAll('[data-act="lgres"]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.r===S.lgRes))});break;
    case 'lgq':var lx=$('#lgX');if(lx){lx.value=(lx.value?lx.value+' ':'')+t.dataset.q+' ';lx.focus()}break;
    case 'logreal':
      if(needName())break;
      var txt=($('#lgX').value||'').trim().slice(0,240),theme=$('#lgT').value;
      if(txt.length<5){toast('Type what the shopper asked');break}
      var today=myStats().logsToday,pts=today>=10?0:10+(txt.length>=20?5:0);
      var pr=LOGP.find(function(x){return x[0]===S.lgProd});
      saveRec({type:'real',product:pr?pr[1]:'Other',theme:theme,text:txt,result:S.lgRes});
      S.lgRes='';
      toast(pts?'+'+pts+' points. Thank you!':'Logged. Daily points limit reached');
      render();break;
  }
});
document.addEventListener('keydown',function(e){
  if(e.target&&e.target.id==='ta'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendTxt(e.target.value)}
});
document.addEventListener('input',function(e){
  var id=e.target&&e.target.id;
  if(id==='ta'){e.target.style.height='auto';e.target.style.height=Math.min(120,e.target.scrollHeight)+'px'}
  if(id==='q'){var r=$('#sres');if(r)r.innerHTML=searchHtml(e.target.value)}
  if(id==='q2'){S.pq=e.target.value;var r2=$('#res2');if(r2)r2.innerHTML=searchHtml(S.pq);var pb=$('#pblock');if(pb)pb.hidden=!!S.pq.trim()}
});

/* ---------- CAPABILITIES ---------- */
(async function(){
  var lg=$('#logoImg');if(lg)lg.src=IMG.logo;
  render();
  try{
    if(window.claude&&window.claude.use){
      sampleFn=await window.claude.use('sample');
      S.ai=sampleFn?'ok':'off';
      try{
        var db=await window.claude.use('db');
        if(db){
          dbRef=db;
          db.collection('sessions').orderBy('ts','desc').limit(1000).onSnapshot(function(snap){
            S.dbDocs=snap.docs.map(function(d){return d.data()});
            refreshLive();
          },function(){S.dbDocs=null});
        }
      }catch(e){}
    }else S.ai='off';
  }catch(e){S.ai='off'}
  var ae=document.activeElement;
  if(!(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))&&S.view!=='session'&&!S.coaching)render();
})();

})();
</script>
