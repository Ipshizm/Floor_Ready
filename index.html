<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Floor Ready</title>
<style>
/* Layout: mobile-first app with bottom dock, top tabs on desktop; SharkNinja teal/black/white/silver */
:root{
  --bg:#ffffff; --surface:#f2f3f4; --surface-2:#e4e5e7; --ink:#000000; --muted:#4b4c4e;
  --line:#d3d4d6; --teal:#00a5af; --on-teal:#000000; --accent-text:#000000;
  --warn:#e74c39; --ok:#97c93c; --chip-a-bg:#000000; --chip-a-ink:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#171717; --surface-2:#2a2a2a; --ink:#ffffff; --muted:#bbbdc0;
    --line:#333333; --accent-text:#00a5af; --chip-a-bg:#ffffff; --chip-a-ink:#000000; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#171717; --surface-2:#2a2a2a; --ink:#ffffff; --muted:#bbbdc0;
  --line:#333333; --accent-text:#00a5af; --chip-a-bg:#ffffff; --chip-a-ink:#000000; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 "Proxima Nova","Gotham","Helvetica Neue",Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding-inline:20px}
h1,h2,h3,p{margin:0}
.pivot{display:inline-block;width:30px;height:10px;background:var(--teal);transform:skewX(-24deg);flex:none}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;height:56px}
.mark{display:flex;align-items:center;gap:12px;font-weight:700;font-size:20px;letter-spacing:0;background:none;border:0;padding:0;color:var(--ink)}
.tabs{display:none;gap:4px}
.tab{background:none;border:0;padding:8px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--teal)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock button{background:none;border:0;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:12.5px;font-weight:600;color:var(--muted)}
.dock button[aria-current="page"]{color:var(--ink)}
.dock button[aria-current="page"] svg{stroke:var(--teal)}
.dock svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
body[data-view="session"] .dock{display:none}
@media (min-width:780px){.tabs{display:flex}.dock{display:none}}

main{padding-top:28px;padding-bottom:110px;min-height:70vh}
body[data-view="session"] main{padding-top:0;padding-bottom:0}
@media (min-width:780px){main{padding-bottom:64px}}

/* hero */
.hero h1{font-size:clamp(30px,7.2vw,48px);line-height:1.04;font-weight:700;max-width:16em}
.lede{margin-top:14px;color:var(--muted);max-width:34em;font-size:17px}
.controls{margin:26px 0 8px;display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:6px}
.lab{font-size:13px;font-weight:600;color:var(--muted)}
.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--on-teal)}
.ghost{background:none;border:1.5px solid var(--ink);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px}
.ghost:hover{border-color:var(--teal)}
.primary{background:var(--teal);color:var(--on-teal);border:0;border-radius:999px;padding:11px 22px;font-weight:700}
.primary:disabled{opacity:.45;cursor:not-allowed}
.banner{margin:18px 0 0;padding:12px 16px;border-left:4px solid var(--warn);background:var(--surface);font-size:15px}

/* persona cards */
.personas{display:grid;gap:14px;margin-top:20px;grid-template-columns:1fr}
@media (min-width:640px){.personas{grid-template-columns:1fr 1fr}}
.pcard{position:relative;text-align:left;background:var(--surface);border:1.5px solid transparent;border-radius:4px 18px 18px 4px;
  padding:18px 18px 16px 26px;display:flex;flex-direction:column;gap:10px;min-height:210px;min-width:0}
.pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--teal);clip-path:polygon(0 0,100% 0,35% 100%,0 100%)}
.pcard:hover{border-color:var(--teal)}
.pcard-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:999px}
.chip.shark{background:var(--chip-a-bg);color:var(--chip-a-ink)}
.chip.ninja{background:var(--teal);color:#000}
.vs{font-size:13px;color:var(--muted);font-weight:600}
.pcard-quote{font-size:19px;line-height:1.28;font-weight:600}
.pcard-name{font-weight:700;margin-top:auto}
.pcard-store{font-size:13.5px;color:var(--muted);margin-top:-6px}

/* session */
.session{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.s-top{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:10px 0}
.s-title{flex:1;min-width:0}
.s-title b{display:block;font-size:16px;line-height:1.2}
.s-title span{font-size:13px;color:var(--muted)}
.icon-btn{background:none;border:1.5px solid var(--line);border-radius:999px;width:42px;height:42px;display:grid;place-items:center;flex:none}
.icon-btn[aria-pressed="true"]{border-color:var(--teal);background:var(--teal);color:#000}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.brief{margin:14px 0 6px;padding:10px 14px;border-left:4px solid var(--teal);background:var(--surface);font-size:14px;color:var(--muted)}
.thread{flex:1;padding:14px 0 18px}
.b{max-width:88%;padding:10px 14px;border-radius:16px;margin:0 0 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.b.shopper{background:var(--surface);border-bottom-left-radius:4px}
.b.you{background:var(--teal);color:#000;margin-left:auto;border-bottom-right-radius:4px}
.b.wait{color:var(--muted);font-style:italic}
.note{font-size:14px;color:var(--muted);margin:0 0 12px;padding:10px 14px;border:1px dashed var(--line);border-radius:10px}
.note button{background:none;border:0;padding:0;text-decoration:underline;font-weight:600}
.composer{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.c-row{display:flex;gap:8px;align-items:flex-end}
.c-row textarea{flex:1;min-width:0;resize:none;min-height:46px;max-height:130px;border:1.5px solid var(--line);border-radius:23px;padding:11px 16px;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.35}
.c-row textarea:focus{border-color:var(--teal);outline:none}
.c-tools{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.linkish{background:none;border:0;padding:0;font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.end-btn{margin-left:auto}
.micnote{font-size:13px;color:var(--muted)}

/* debrief */
.deb h1{font-size:clamp(28px,6.4vw,42px);line-height:1.06;font-weight:700;max-width:17em}
.deb .sub{margin-top:10px;color:var(--muted)}
.scores{margin:28px 0 8px;display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:640px){.scores{grid-template-columns:1fr 1fr}}
.sc{border-top:3px solid var(--teal);padding-top:10px}
.sc-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sc-h b{font-size:15px}
.sc p{margin-top:6px;font-size:14.5px;color:var(--muted)}
.meter{display:inline-flex;gap:4px}
.meter i{width:20px;height:9px;background:var(--surface-2);transform:skewX(-24deg)}
.meter i.on{background:var(--teal)}
@media (prefers-reduced-motion:no-preference){
  .deb .meter i.on{animation:fill .5s both}
  .deb .meter i:nth-child(2){animation-delay:.08s}.deb .meter i:nth-child(3){animation-delay:.16s}
  .deb .meter i:nth-child(4){animation-delay:.24s}.deb .meter i:nth-child(5){animation-delay:.32s}
  @keyframes fill{from{background:var(--surface-2)}to{background:var(--teal)}}
}
.reveal{margin:26px 0;border:1.5px solid var(--ink)}
.reveal summary{list-style:none;cursor:pointer;padding:16px 18px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:12px;
  background:repeating-linear-gradient(-45deg,var(--teal) 0 12px,var(--bg) 12px 24px);color:#000}
.reveal summary span{background:var(--bg);color:var(--ink);padding:4px 12px;border-radius:999px;font-size:14px}
.reveal summary::-webkit-details-marker{display:none}
.reveal[open] summary{background:var(--teal)}
.reveal .rv{padding:16px 18px;display:grid;gap:10px}
.found{font-weight:700}
.two{display:grid;gap:22px;grid-template-columns:1fr;margin-top:6px}
@media (min-width:640px){.two{grid-template-columns:1fr 1fr}}
.two h3,.h3{font-size:17px;font-weight:700;margin-bottom:8px}
ul.clean{margin:0;padding-left:18px;display:grid;gap:8px}
.say{margin-top:24px;padding:18px 20px;background:var(--surface);border-left:6px solid var(--teal)}
.say q{display:block;font-size:20px;font-weight:600;line-height:1.3;quotes:"“" "”";margin-top:6px}
.flag{margin-top:22px;padding:14px 16px;border-left:4px solid var(--warn);background:var(--surface)}
.themes{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.theme{border:1.5px solid var(--line);border-radius:999px;padding:3px 12px;font-size:14px;font-weight:600}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.loading{padding:56px 0;display:grid;gap:14px;justify-items:start}
.loading .pivot{width:64px}

/* guide */
.page-h{font-size:clamp(26px,5.6vw,38px);line-height:1.08;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.fchip{border:1.5px solid var(--line);background:none;border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.prod{border:1.5px solid var(--line);margin:0 0 14px;border-radius:4px 16px 16px 4px;overflow:hidden}
.prod>summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.prod>summary::-webkit-details-marker{display:none}
.prod>summary b{font-size:18px;display:block;line-height:1.2}
.prod>summary small{color:var(--muted);font-size:14px}
.prod[open]>summary{border-bottom:1px solid var(--line);background:var(--surface)}
.facts{padding:14px 18px 4px;font-size:14.5px}
.facts ul{margin:0;padding-left:18px;display:grid;gap:4px}
.confirm{margin:10px 18px 4px;font-size:13.5px;color:var(--muted)}
.qs{padding:8px 18px 18px}
.q{border-top:1px solid var(--line)}
.q summary{list-style:none;cursor:pointer;padding:14px 0;display:grid;gap:2px}
.q summary::-webkit-details-marker{display:none}
.q summary b{font-weight:600;font-size:16.5px}
.q summary small{color:var(--muted);font-size:13.5px}
.q .qb{padding:0 0 16px;display:grid;gap:12px}
.qb .lab{margin-bottom:2px}
.qb .sayline{padding:10px 14px;background:var(--surface);border-left:4px solid var(--teal);font-weight:600}
.qb .care{padding:10px 14px;border-left:4px solid var(--warn);background:var(--surface);font-size:15px}
.vcard{border:1.5px solid var(--line);padding:18px;margin-bottom:14px;border-radius:4px 16px 16px 4px;display:grid;gap:12px}
.vcard h3{font-size:19px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag-warn{font-size:12.5px;font-weight:700;background:var(--warn);color:#000;border-radius:999px;padding:2px 10px}
.gap{display:grid;gap:4px;padding:14px 0;border-top:1px solid var(--line)}
.gap b{font-size:16.5px}
.gap .st{justify-self:start;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--surface-2)}

/* insights */
.stats{display:grid;gap:14px;grid-template-columns:1fr 1fr;margin:22px 0}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{border-top:3px solid var(--teal);padding-top:8px}
.stat b{font-size:34px;line-height:1;font-weight:700;display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:13.5px;color:var(--muted)}
.bars{display:grid;gap:10px;margin:12px 0 4px}
.bar{display:grid;grid-template-columns:minmax(120px,38%) 1fr 28px;gap:10px;align-items:center;font-size:14.5px}
.bar i{display:block;height:12px;background:var(--teal);transform:skewX(-24deg);transform-origin:left}
.bar em{font-style:normal;font-weight:700;text-align:right}
.split{display:flex;height:16px;margin:10px 0 6px}
.split i{display:block;height:100%}
.sec{margin-top:36px}
.sec h2{font-size:22px;font-weight:700}
.sec>p{color:var(--muted);margin-top:4px}
.logform{display:grid;gap:12px;margin-top:14px;padding:18px;background:var(--surface);border-radius:4px 16px 16px 4px;border-left:6px solid var(--teal)}
.logform select,.logform textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--ink);font-size:16px}
.logform textarea{min-height:70px;resize:vertical}
.priv{margin-top:26px;font-size:13.5px;color:var(--muted)}
.recent{display:grid;gap:8px;margin-top:14px}
.recent div{padding:10px 14px;border-left:4px solid #bbbdc0;background:var(--surface);font-size:15px}
.empty{padding:22px;border:1.5px dashed var(--line);border-radius:12px;color:var(--muted)}
/* landing */
.land h1{font-size:clamp(34px,8.4vw,58px);line-height:1.0;font-weight:700;max-width:11em}
.land .hi{margin-top:10px;color:var(--muted);font-size:17px;max-width:30em}
.sbox{position:relative;margin-top:24px}
.sbox label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
.sfield{position:relative}
.sfield svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}
.sfield input{width:100%;border:2px solid var(--ink);border-radius:999px;padding:15px 20px 15px 52px;font-size:17px;background:var(--bg);color:var(--ink)}
.sfield input:focus{border-color:var(--teal);outline:3px solid rgba(0,165,175,.35);outline-offset:0}
.sugg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sres{margin-top:12px}
.sres:empty{display:none}
.sres .inner{border:1.5px solid var(--line);border-radius:4px 16px 16px 4px;padding:2px 16px 4px}
.sres .q:first-child{border-top:0}
.today{position:relative;margin-top:28px;background:var(--teal);color:#000;padding:24px 24px 34px;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 24px),calc(100% - 44px) 100%,0 100%)}
.today .lab{color:#000;opacity:.78;font-size:14px;font-weight:600}
.today q{display:block;font-size:clamp(23px,5.8vw,34px);line-height:1.16;font-weight:700;margin:10px 0 8px;quotes:"\201C" "\201D";max-width:20em}
.today .who{font-size:15px;max-width:34em}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn-black{background:#000;color:#fff;border:2px solid #000;border-radius:999px;padding:12px 22px;font-weight:700}
.btn-line{background:none;color:#000;border:2px solid #000;border-radius:999px;padding:12px 22px;font-weight:700}
.btn-black:focus-visible,.btn-line:focus-visible{outline-color:#000}
.tiles{display:grid;gap:12px;margin-top:22px;grid-template-columns:1fr}
@media (min-width:640px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;text-align:left;display:grid;grid-template-columns:44px 1fr;gap:6px 14px;align-items:center;background:var(--surface);
  border:1.5px solid transparent;border-radius:4px 18px 18px 4px;padding:16px 16px 16px 24px;min-width:0}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background:var(--teal);clip-path:polygon(0 0,100% 0,35% 100%,0 100%)}
.tile:hover{border-color:var(--teal)}
.tile .ti svg{width:34px;height:34px;fill:none;stroke:var(--teal);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
.tile .tt{display:block}
.tile b{display:block;font-size:19px;line-height:1.15}
.tile .d{display:block;font-size:14.5px;color:var(--muted);margin-top:3px}
.tile .m{display:block;font-size:13px;font-weight:700;margin-top:6px}
@media (min-width:640px){.tile{grid-template-columns:1fr;align-items:start;min-height:200px}.tile .ti{margin-bottom:6px}}
.resume{margin-top:26px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--line);font-size:15px}
.resume span{color:var(--muted)}
/* learn */
.lsec{padding:16px 18px 4px}
.lsec h3{font-size:16px;font-weight:700;margin:0 0 8px}
.lsec p{margin:0}
.specs{display:grid;grid-template-columns:1fr;margin:0}
@media (min-width:640px){.specs{grid-template-columns:1fr 1fr;column-gap:26px}}
.specs div{padding:9px 0;border-top:1px solid var(--line)}
.specs dt{font-size:13px;font-weight:600;color:var(--muted)}
.specs dd{margin:0;font-size:15.5px}
.specs dd em{font-style:normal;color:var(--muted);font-size:13px}
.feat{padding:12px 14px;border-left:4px solid var(--teal);background:var(--surface);margin-bottom:10px}
.feat b{display:block}
.feat p{margin:2px 0 0;font-size:15px}
.feat .gain{font-weight:600;margin-top:6px}
.fitgrid{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:640px){.fitgrid{grid-template-columns:1fr 1fr}}
.flagbox{margin:12px 18px 0;padding:12px 14px;border-left:4px solid var(--warn);background:var(--surface);font-size:15px}
.flagbox b{display:block;margin-bottom:4px}
.flagbox ul{margin:0;padding-left:18px;display:grid;gap:4px}
.lact{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:16px 18px 18px}
.srcnote{font-size:13px;color:var(--muted)}
.tbl{overflow-x:auto;margin:14px 0 24px;border:1.5px solid var(--line)}
.tbl table{border-collapse:collapse;min-width:720px;width:100%;font-size:14.5px}
.tbl th,.tbl td{padding:10px 12px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}
.tbl thead th{border-top:0;background:var(--surface);font-weight:700}
.tbl th[scope="row"]{position:sticky;left:0;background:var(--surface);font-weight:600;min-width:120px}
.need{display:grid;gap:2px;padding:12px 0;border-top:1px solid var(--line)}
.need b{font-size:16.5px}
.need span{color:var(--muted);font-size:15px}
.terms{margin:0}
.terms dt{font-weight:700;margin-top:16px}
.terms dd{margin:2px 0 0;color:var(--muted)}
/* drills */
.topics{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 18px}
.topic{border:1.5px solid var(--line);background:none;border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;display:inline-flex;gap:8px;align-items:center}
.topic.on{border-color:var(--teal);background:var(--teal);color:#000}
.tk{font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--surface-2);color:var(--ink)}
.tk.best{background:var(--ok);color:#000}.tk.risk{background:var(--warn);color:#000}
.shopbub{padding:18px 20px;background:var(--surface);border-left:6px solid var(--teal);margin-bottom:16px}
.shopbub q{display:block;font-size:clamp(19px,4.6vw,24px);font-weight:600;line-height:1.3;margin-top:6px;quotes:"\201C" "\201D"}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:4px 16px 16px 4px;padding:14px 16px;min-width:0}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt:disabled{cursor:default;color:var(--ink)}
.opt .ol{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink);font-weight:700;font-size:14px}
.opt .ot{overflow-wrap:anywhere}
.opt.done:not(.sel){opacity:.72}
.opt.sel.best{border-color:var(--ok);border-width:2.5px}
.opt.sel.ok{border-color:var(--muted);border-width:2.5px}
.opt.sel.risk{border-color:var(--warn);border-width:2.5px}
.fb{margin:-4px 0 4px 42px;padding:10px 14px;background:var(--surface);border-left:4px solid var(--line);font-size:15px}
.fb.best{border-left-color:var(--ok)}.fb.risk{border-left-color:var(--warn)}
.vtag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;margin-right:6px;background:var(--surface-2)}
.vtag.best{background:var(--ok);color:#000}.vtag.risk{background:var(--warn);color:#000}
/* compare, terms */
.tbl td.us,.tbl th.us{background:rgba(0,165,175,.14)}
.tbl thead th.us{box-shadow:inset 0 -3px 0 var(--teal)}
.cmpbox{padding:14px 16px;border-top:3px solid var(--teal);background:var(--surface)}
.cmpbox.be{border-top-color:var(--warn)}
.cmpbox h3{margin:0 0 8px;font-size:16px}
.costcard{margin:6px 0 26px;padding:18px;background:var(--surface);border-left:6px solid var(--teal)}
.cbody{display:grid;margin-top:14px}
.crow{display:flex;justify-content:space-between;gap:14px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.crow>div{min-width:0}
.crow b{display:block}
.crow span{display:block;font-size:13.5px;color:var(--muted)}
.crow em{font-style:normal;font-weight:700;font-size:17px;text-align:right;font-variant-numeric:tabular-nums;flex:none;max-width:48%}
.cnote{margin:12px 0 8px;font-size:15px}
.term{border:1.5px solid var(--line);margin:0 0 10px;border-radius:4px 14px 14px 4px;padding:0 16px}
.term>summary{padding:14px 0}
.term[open]{background:var(--bg)}
.benefit{padding:10px 14px;background:var(--surface);border-left:4px solid var(--teal);font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:999px;font-size:14.5px;font-weight:600;z-index:60;max-width:90vw;display:none}
</style>

 [`Capacity`,`1.4 L and 3.8 L glass containers`,`6.2 L`],
 [`Functions`,`4: Air Fry, Roast, Recrisp, Keep Warm`,`13-in-1, including bake and grill`],
 [`Power`,`1,700 W`,`1,700 W`],
 [`See the food`,`Glass, 360 degree clear view`,`Cooking window`],
 [`Container`,`Borosilicate glass. Listed BPA-free and PFAS-free (Croma)`,`Confirm basket coating`],
 [`Bakes and grills`,`No`,`Yes`],
 [`Leftovers`,`Dedicated Recrisp function`,`Confirm`],
 [`Controls`,`Top-mounted soft-touch panel`,`Touch panel`],
 [`Warranty`,`Confirm`,`2 years`]],
 win:[`Glass container for shoppers who worry about coatings.`,`A small container for one or two portions, plus a bigger one.`,`Recrisp brings leftovers back to crunchy.`],
 straight:[`NA231 is cheaper, bigger and does more.`,`NA231 also has a window. Do not say Crispi is the only one you can see through.`,`Both are 1,700 W. Watts do not separate them.`],
 lead:`Ask who they cook for and whether they bake. A couple who snack and reheat can like Crispi. If they want baking or grilling, show Combi. Do not push Crispi against the facts.`,
 src:`Philips India, Amazon India, Reliance Digital, Croma. Checked Nov 2026.`}
];

/* Consumer-friendly terms. Each one says what it is, what it means for the shopper, and what to say. */
var TERM_GROUPS=[['all','All'],['general','General'],['combi','Combi'],['crispi','Crispi'],['hydrovac','HydroVac'],['hp300','HP300']];
var TERMS=[
{g:'general',t:`High wattage (Crispi is 1,700 W)`,
 plain:`Watts show how much power the heater and fan draw.`,
 benefit:`More watts usually means it heats up faster and recovers heat faster, so food is ready sooner.`,
 say:`Zyada watt ka matlab garam jaldi hota hai, toh khana jaldi tayyar hota hai.`,
 care:`Do not say it saves electricity or cooks better. Philips NA231 is also 1,700 W, so watts alone do not win the sale.`},
{g:'general',t:`Watts and air watts`,
 plain:`Dyson quotes suction as air watts. SharkNinja lists watts. They measure different things.`,
 benefit:`The numbers cannot be compared head to head, so judge by how it cleans their own floor.`,
 say:`Dono alag tarah se naap rahe hain. Aapke ghar ka sabse mushkil kachra yahin chala ke dikhata hoon.`,
 care:`Never convert one into the other.`},
{g:'hp300',t:`NeverChange filter`,
 plain:`A HEPA filter listed to last up to 5 years, so there is no yearly filter to buy. See the cost table below.`,
 benefit:`Saves money over the years and means one less thing to remember. The filter bill is the hidden cost of most purifiers.`,
 say:`Filter 5 saal tak chalne ke liye test hua hai, toh har saal ka filter kharcha nahi.`,
 care:`Say "up to 5 years". It is a tested maximum and depends on use and air quality. Never say it never needs changing.`},
{g:'hp300',t:`HEPA and True HEPA 14`,
 plain:`A very fine filter that catches tiny particles such as dust, smoke, pollen and pet dander. HEPA 14 is a higher grade than basic HEPA.`,
 benefit:`Cleaner air for families with allergies, kids, elders and pets.`,
 say:`Ye filter dhool, dhuan, pollen aur pet ke baal jaise bahut chhote kann pakadta hai.`,
 care:`Brands test at different particle sizes. HP300 lists 99.98% at 0.1 to 0.2 microns. Dyson lists 99.97% at 0.3 microns. Philips quotes down to 0.003 microns. Do not compare the percentages directly.`},
{g:'hp300',t:`CADR`,
 plain:`Clean Air Delivery Rate. How much clean air the purifier produces in an hour.`,
 benefit:`A higher number cleans a room faster. Match it to the room size.`,
 say:`Ye batata hai ki machine ek ghante mein kitni saaf hawa deti hai. Aapke kamre ke liye hum yahi dekhte hain.`,
 care:`The India CADR for HP300 is not confirmed. Philips 3400 lists 300 m³/h. Do not quote one without the other in the same units.`},
{g:'hp300',t:`Room size claims (sq ft)`,
 plain:`The size of room the purifier can clean in a set time under test conditions.`,
 benefit:`Helps pick the right machine. A smaller room than the claim should clean faster.`,
 say:`Ye tested figure hai. Aapka kamra kitna bada hai? Usi ke hisaab se bataunga.`,
 care:`HP300 says up to 1,400 sq ft in one hour. Do not promise a whole home in an hour.`},
{g:'hp300',t:`Noise (dB)`,
 plain:`Decibels measure loudness. A lower number is quieter.`,
 benefit:`Matters most for a bedroom, where the purifier runs all night.`,
 say:`Raat ke liye sleep mode yahin chala ke dikhata hoon, aap khud suniye.`,
 care:`Dyson lists 24 dB in sleep mode. HP300's 38.8 dB is from a retailer page and its mode is not stated. Confirm before quoting.`},
{g:'hp300',t:`Clean Sense IQ`,
 plain:`A sensor that reads fine dust (PM1, PM2.5, PM10) and adjusts fan speed.`,
 benefit:`It works harder when the air is bad and eases off when it is clean, so the shopper never has to adjust it.`,
 say:`Aapko kuch karna nahi hai. Hawa kharab hogi toh ye khud tez chalega.`,
 care:`Confirm the exact sensor wording on the approved sheet.`},
{g:'hp300',t:`Debris Defense`,
 plain:`Screens in front of the HEPA filter that catch hair, dust and dander.`,
 benefit:`The main filter stays cleaner and keeps working longer. You vacuum or rinse the screens.`,
 say:`Pehle baal aur dhool in jaali mein ruk jaate hain. Unko aap vacuum ya dho sakte ho.`,
 care:`Say the screens are cleaned. Do not say the machine needs no upkeep at all.`},
{g:'combi',t:`Non-toxic coating (Combi pan)`,
 plain:`A non-stick coating stops food sticking. Some older coatings (PTFE, PFOA) worry people. Combi's pan is aluminium with a nano-ceramic non-stick coating, listed as PTFE-free and PFOA-free.`,
 benefit:`Peace of mind for families who cook every day, and easy washing.`,
 say:`Pan par ceramic non-stick coating hai, jo PTFE aur PFOA free bataya gaya hai.`,
 care:`Say "PTFE-free and PFOA-free". Do not say chemical-free or 100% safe. The listing is from Shark's US support page. Confirm the India wording first.`},
{g:'crispi',t:`Glass container (Crispi)`,
 plain:`Crispi cooks in borosilicate glass containers instead of a coated metal basket. The Croma listing says BPA-free and PFAS-free.`,
 benefit:`Nothing to flake off a coating. You can see the food cook, and the glass goes from freezer to air fryer.`,
 say:`Isme glass ka container hai, toh coating ki chinta nahi. Khana andar dikhta bhi hai.`,
 care:`Do not say it cannot break. Confirm the India warranty and safety wording.`},
{g:'crispi',t:`Recrisp`,
 plain:`A setting that brings leftovers back to fryer-fresh crunch.`,
 benefit:`Yesterday's samosa or fries taste fresh again, instead of going soft in the microwave.`,
 say:`Kal ka bacha hua snack phir se kurkura ho jaata hai.`,
 care:`Do not promise it is identical to freshly cooked.`},
{g:'combi',t:`HyperSteam`,
 plain:`Superheated steam with fast-moving hot air.`,
 benefit:`Food stays moist inside and crisp outside. Kebabs and vegetables are less likely to dry out.`,
 say:`Bhaap aur garam hawa dono saath chalte hain, toh andar se naram aur bahar se kurkura.`,
 care:`Keep it to the listed benefit.`},
{g:'combi',t:`Combi Meals`,
 plain:`A main and two sides cooked together so they finish together, in about 15 minutes.`,
 benefit:`Dinner lands on the table at the same time, with one cook and one timer.`,
 say:`Sabzi, chawal aur ek aur cheez ek saath ban jaati hai.`,
 care:`Confirm how trays keep dishes separate before promising veg and non-veg apart.`},
{g:'combi',t:`Wet and dry bake`,
 plain:`Wet mode adds steam for soft breads and cakes. Dry bake is the usual oven-style roasting.`,
 benefit:`A soft cake and a crisp roast from the same machine.`,
 say:`Cake naram chahiye toh wet bake, roast ke liye dry bake.`,
 care:`Do not call it a replacement for every oven recipe.`},
{g:'general',t:`Air Fry and Max Crisp`,
 plain:`Air fry moves hot air quickly around food. On Max Pro, Max Crisp is 240°C superheated air with strong airflow.`,
 benefit:`Fried-style crunch with little to no oil.`,
 say:`Tel bahut kam, par kurkura wahi.`,
 care:`The 75% less fat figure is a listing claim. Do not say fat free.`},
{g:'hydrovac',t:`Self-clean mode`,
 plain:`On the dock, the brush, floorhead and tubing are washed.`,
 benefit:`No scrubbing a dirty brush roll after mopping.`,
 say:`Dock pe rakho, brush khud dhul jaata hai.`,
 care:`Confirm the exact steps on the approved sheet.`},
{g:'hydrovac',t:`Freshen mode`,
 plain:`A mode for refreshing area rugs, thin-pile rugs and mats.`,
 benefit:`A quick refresh for rugs between deep cleans.`,
 say:`Chhote rug aur mat ko jaldi taaza karne ke liye hai.`,
 care:`It is not a deep carpet clean. Do not promise it for wall-to-wall carpet.`},
{g:'general',t:`BLDC motor`,
 plain:`A brushless motor, listed for FlexBreeze at 36 W.`,
 benefit:`Quieter and efficient cooling.`,
 say:`Isme motor halki awaaz mein chalti hai aur bijli kam khaati hai.`,
 care:`Do not promise a bill saving.`},
{g:'general',t:`IPX4`,
 plain:`Protected against water splashes.`,
 benefit:`FlexBreeze can be used on a balcony in light rain.`,
 say:`Halki baarish ke chheente ho toh chalega.`,
 care:`Not for heavy rain, and do not charge it in rain.`}
];

/* 5-year filter cost. Philips figure uses 3000-series FY3433 prices (Rs 2,880 to Rs 3,510) and about one filter a year. Indicative. */
var COST={items:[

 {n:`Philips (3000-series filter price)`,low:2880,high:3510,note:`Philips says about every 12 months. Confirm the 3400 filter price and life`},
 {n:`Dyson HushJet Compact`,low:null,high:null,note:`Filter listed for up to 5 years. Confirm replacement price`}
]};

/* Question drills. Each scenario has three possible replies. v: best | ok | risk */
var DRILLS=[
{p:'combi',topic:`Price vs Philips`,q:`Philips OneChef ₹10,000 sasta hai aur 33-in-1 hai. Isme kya extra hai?`,
 opts:[
 {t:`OneChef mein functions zyada hain, par Combi ki quality better hai.`,v:'risk',f:`Vague and runs down a competitor. You cannot back "better quality" with a fact.`},
 {t:`Dono alag tarah ke hain. Aapke ghar mein kitne log khaate hain, aur kya banate ho? Combi 12.5 litre ka hai aur main aur do sides ek saath banata hai.`,v:'best',f:`You asked first and then named real differences: size and cooking several dishes at once.`},
 {t:`Haan OneChef sasta hai, wahi le lo.`,v:'ok',f:`Honest about price, but you gave up without asking what they need.`}],
 why:`Do not argue on price or function count. OneChef is cheaper and lists more functions. Win on family size and dinner-hour fit.`},
{p:'combi',topic:`Coating safety`,q:`Andar ka coating safe hai? Non-stick mein koi chemical toh nahi?`,
 opts:[
 {t:`Bilkul non-toxic hai, 100% safe.`,v:'risk',f:`Too absolute. No brand can promise "100% safe".`},
 {t:`Pan aluminium ka hai jis par ceramic non-stick coating hai, jo PTFE aur PFOA free bataya gaya hai. India wali exact wording main approved sheet se confirm karke bata deta hoon.`,v:'best',f:`Specific, uses the listed claim, and offers to confirm the India wording.`},
 {t:`Sab non-stick coating same hote hain, chinta mat kijiye.`,v:'risk',f:`Dismisses a real worry and is not true. Shoppers care about PTFE and PFOA.`}],
 why:`Say "PTFE-free and PFOA-free". The listing is from Shark's US support page, so confirm the India wording before using it.`},
{p:'combi',topic:`Why so expensive`,q:`₹29,990? Itna mehnga kyun?`,
 opts:[
 {t:`Aap abhi oven, air fryer aur steamer alag lete toh kitna kharch hota? Combi teeno ka kaam karta hai aur counter pe ek hi jagah leta hai.`,v:'best',f:`You reframed price as total cost and counter space, which is the real concern.`},
 {t:`Main manager se baat karke discount dila dunga.`,v:'risk',f:`You invented an offer you cannot confirm.`},
 {t:`Quality ki wajah se.`,v:'ok',f:`Honest but empty. It gives the shopper nothing to weigh.`}],
 why:`Ask which appliances it would replace, and add them up with the shopper. Only mention offers that are approved.`},
{p:'combi',topic:`Veg and non-veg`,q:`Veg aur non-veg alag ban sakta hai ek saath?`,
 opts:[
 {t:`Haan bilkul, koi problem nahi.`,v:'risk',f:`You promised something that is not confirmed.`},
 {t:`Do-teen dish ek saath ban sakti hain. Tray kaise lagti hain main abhi dikhata hoon, aur alag rakhne ka tareeka sheet se confirm kar leta hoon.`,v:'best',f:`Accurate, shows the product, and does not promise what you have not checked.`},
 {t:`Nahi ho sakta.`,v:'ok',f:`May be wrong too. Do not say no until you have checked.`}],
 why:`Confirm how the trays keep dishes apart before you promise it.`},

{p:'crispi',topic:`Price vs Philips NA231`,q:`Philips ka 6.2 litre ₹10,000 mein aata hai aur bake bhi karta hai. Crispi itna mehnga kyun?`,
 opts:[
 {t:`Crispi bhi bake kar leta hai.`,v:'risk',f:`False. Crispi has no baking function.`},
 {t:`Philips ka quality achha nahi hota.`,v:'risk',f:`Runs down a competitor with no facts.`},
 {t:`Philips bada hai aur bake-grill karta hai, ye sach hai. Crispi chhote batch ke liye hai aur glass mein khana dikhta hai. Aap kitne log ke liye banate ho, aur bake karte ho?`,v:'best',f:`Honest about their strengths, names your fit, and asks what the shopper needs.`}],
 why:`NA231 is cheaper, bigger and does more. Win only if the shopper values glass, small batches and Recrisp. Otherwise send them to Combi.`},
{p:'crispi',topic:`What does 1,700 W mean`,q:`1700 watt ka matlab kya hai? Zyada hai kya?`,
 opts:[
 {t:`Sabse zyada power wala air fryer yahi hai.`,v:'risk',f:`Not true. Philips NA231 is also 1,700 W.`},
 {t:`Zyada watt ka matlab garam jaldi hota hai, toh khana jaldi tayyar hota hai. Philips bhi 1700 W ka hai, isliye asli farak size aur glass ka hai.`,v:'best',f:`Explains the benefit simply and stays honest that watts do not separate the two.`},
 {t:`Isse bijli ka bill kam aayega.`,v:'risk',f:`Unsupported. More watts does not mean a lower bill.`}],
 why:`Turn the number into a benefit (faster cooking) and do not claim more than that.`},
{p:'crispi',topic:`Glass breaking`,q:`Glass tootega toh? Gir gaya toh?`,
 opts:[
 {t:`Ye tootega nahi, bahut mazboot hai.`,v:'risk',f:`You cannot promise that.`},
 {t:`Borosilicate glass hai, freezer se air fryer tak chalne ke liye bataya gaya hai. Girne par kya cover hai, wo main warranty wording se aapko saaf bata deta hoon.`,v:'best',f:`Gives the real claim and is open about what is covered.`},
 {t:`Steel wala le lo, usme tension nahi.`,v:'ok',f:`Sends them away from your product without checking their need.`}],
 why:`Do not say it cannot break. Confirm the India warranty wording before you speak about damage.`},
{p:'crispi',topic:`Baking and grilling`,q:`Isme cake ya grill ho sakta hai?`,
 opts:[
 {t:`Crispi mein baking aur grill nahi hai. Air fry, roast, recrisp aur keep warm hai. Baking chahiye toh Combi dikhata hoon.`,v:'best',f:`Clear, honest, and you point them to the right model.`},
 {t:`Haan thoda bahut ho jayega.`,v:'risk',f:`Vague and untrue. It will disappoint them at home.`},
 {t:`Ye toh air fryer hai, isme bake kaun karta hai.`,v:'ok',f:`True that it does not bake, but dismissive and you lost the sale to Combi.`}],
 why:`Recommend the right model even if it is not the one they walked up to.`},

{p:'hydrovac',topic:`Heavier than Dyson`,q:`Ye Dyson se bhaari lag raha hai.`,
 opts:[
 {t:`Nahi nahi, ye bilkul halka hai.`,v:'risk',f:`The shopper just felt the weight. Denying it costs you trust.`},
 {t:`Haan, haath mein dono rakh ke farak lagta hai. Ghar mein zyadatar safai kaun karta hai, aur kitni der?`,v:'best',f:`Acknowledges the truth and asks who will use it, which is what matters.`},
 {t:`Dyson ka suction kamzor hai, isliye halka hai.`,v:'risk',f:`Unsupported claim about a rival.`}],
 why:`Acknowledge, ask who cleans and for how long, then let them try it on their own floor type.`},
{p:'hydrovac',topic:`Sofa and curtains`,q:`Dyson mein sofa aur curtain sab ho jaata hai. Isme?`,
 opts:[
 {t:`Hydrovac floor aur rug ke liye hai, sofa-parde ke liye nahi. Aapki safai mein floor kitna hai aur sofa-parde kitne?`,v:'best',f:`Clear about the limit and asks about the real split.`},
 {t:`Haan, attachments se sab ho jaata hai.`,v:'risk',f:`False. HydroVac is a floor tool.`},
 {t:`Wo sab ke liye alag machine leni padegi.`,v:'ok',f:`True, but you did not ask whether floors are most of their cleaning.`}],
 why:`Say it before they find out at home. HydroVac does not cover sofas, curtains or ceilings.`},
{p:'hydrovac',topic:`Battery`,q:`Battery kitni der chalti hai? Mera ghar bada hai.`,
 opts:[
 {t:`Ek ghante tak chalti hai.`,v:'risk',f:`Not supported. Global pages say about 25 minutes.`},
 {t:`Ghar kitna bada hai? Global pages pe 25 minute ke aas-paas bataya hai. India ka figure confirm karke bataunga. Bada ghar hai toh main seedha bol dunga.`,v:'best',f:`Honest about the figure and asks the size first.`},
 {t:`Chinta mat kijiye, aaram se ho jaayega.`,v:'ok',f:`Reassuring but not an answer.`}],
 why:`Do not promise coverage in square feet unless the approved sheet says so.`},
{p:'hydrovac',topic:`Accidental damage`,q:`Girne par kharab ho gaya toh 2 saal ka damage cover milta hai?`,
 opts:[
 {t:`Haan, sab covered hai.`,v:'risk',f:`Shark does not have an accidental damage cover.`},
 {t:`Accidental damage cover ke saath nahi aata. Standard warranty mein kya hai, wo main saaf bata deta hoon. Aapko kis cheez ka darr hai?`,v:'best',f:`Direct, then asks what the worry is.`},
 {t:`Warranty mein sab kuch aa jaata hai.`,v:'risk',f:`Vague and implies cover that does not exist.`}],
 why:`Read the approved warranty wording exactly. Dyson offers two-year cover and shoppers ask about it.`},

{p:'hp300',topic:`Filter cost vs Philips`,q:`Philips ka sasta lag raha hai, par uska filter har saal badalna padta hai. Isme?`,
 opts:[
 {t:`HP300 ka filter kabhi change nahi karna padega.`,v:'risk',f:`Too absolute. It is listed as up to 5 years.`},
 {t:`Philips ka filter bahut mehnga hota hai.`,v:'ok',f:`Without numbers, it is only a claim.`},
 {t:`HP300 ka filter 5 saal tak chalne ke liye test hua hai. Aap kitne saal ke liye le rahe ho? Main 5 saal ka kharcha likh ke dikhata hoon.`,v:'best',f:`Names the tested life and offers a written cost, which is what this shopper cares about.`}],
 why:`Use the five-year table in Terms. Say "up to 5 years" and that the Philips price is indicative.`},
{p:'hp300',topic:`Dyson also has 5 years`,q:`Dyson HushJet mein bhi 5 saal ka filter hai aur woh quiet hai.`,
 opts:[
 {t:`Dyson bahut mehnga hai.`,v:'risk',f:`Dyson lists ₹29,900, close to HP300. You would be wrong.`},
 {t:`Dyson ka filter 5 saal nahi chalta.`,v:'risk',f:`False. Dyson lists up to 5 years.`},
 {t:`Sahi baat hai, Dyson bhi 5 saal tak bolta hai. Farak aapke kamre, raat ke shor aur budget mein dekhte hain. Aapka bedroom kitna bada hai?`,v:'best',f:`Agrees with the fact and moves to what separates them for this shopper.`}],
 why:`Do not deny that Dyson is quieter in sleep mode. Compare on room size and what the shopper needs.`},
{p:'hp300',topic:`Coverage claim`,q:`1,400 sq ft sach mein? Mera hall itna bada nahi.`,
 opts:[
 {t:`Poora ghar ek ghante mein saaf ho jayega.`,v:'risk',f:`Overpromises. The figure is for one hour under test conditions.`},
 {t:`Ye company ka tested figure hai, ek ghante ke liye. Aapka kamra kitna bada hai? Chhote kamre mein aur jaldi hoga.`,v:'best',f:`States the test condition and moves to their room.`},
 {t:`Number sirf marketing ke liye hota hai.`,v:'ok',f:`Undersells your own product and gives no help.`}],
 why:`State the test condition and ask the room size.`},
{p:'hp300',topic:`Humidifier`,q:`Philips mein humidifier bhi hai. Isme hai?`,
 opts:[
 {t:`Haan, isme bhi hai.`,v:'risk',f:`False. HP300 is a purifier only.`},
 {t:`HP300 sirf purifier hai, humidifier nahi hai. Aapke ghar mein hawa sookhi lagti hai ya dhool aur smoke ka problem zyada hai?`,v:'best',f:`Honest, and asks which problem they actually have.`},
 {t:`Humidifier ki koi zaroorat nahi hoti.`,v:'ok',f:`Dismisses a real need for some homes.`}],
 why:`Philips 3400 humidifies at 650 ml/h. If dry air is their main problem, say HP300 may not be the fit.`}
];
var HINTS=[`Who will use it most at home?`,`What are you using right now, and what annoys you about it?`,`How big is your home, and how often do you clean or cook?`,`What would make you feel this was a good decision a month from now?`,`What worried you when you saw the price?`];
var DIMS=[{k:'diagnose',n:`Asked before pitching`},{k:'need',n:`Found the real need`},{k:'link',n:`Tied it to their life`},{k:'honest',n:`Stayed honest`}];
var OUTCOME={would_buy:`She is reaching for her card.`,thinking:`Wants to think about it, and will probably check online tonight.`,walks:`Walked off to compare online.`};

function toast(m){var t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(function(){t.style.display='none'},3200)}
function meter(n){var h='';for(var i=1;i<=5;i++)h+='<i'+(i<=n?' class="on"':'')+'></i>';return '<span class="meter" role="img" aria-label="'+n+' out of 5">'+h+'</span>'}
function clamp(n){n=Math.round(Number(n)||1);return Math.max(1,Math.min(5,n))}
function allRecs(){return S.dbDocs||S.hist}
function kb(){

  var use=(full.length?full:hits).sort(function(a,b){return b.sc-a.sc}).slice(0,6);

    var crow=COST.items.map(function(it){
      var v=it.low===null?'Confirm':(it.low===0&&it.high===0?'₹0':(it.low===it.high?inr(it.low*S.yrs):inr(it.low*S.yrs)+' to '+inr(it.high*S.yrs)));

  var counts={};R.forEach(function(r){var t=r.type==='real'?[r.theme]:(r.themes||[]);t.forEach(function(x){if(x)counts[x]=(counts[x]||0)+1})});
  var rows=Object.keys(counts).map(function(k){return [k,counts[k]]}).sort(function(a,b){return b[1]-a[1]}).slice(0,8);

  var rr={closed:0,online:0,think:0};re.forEach(function(r){if(rr[r.result]!=null)rr[r.result]++});
  var recent=re.slice().sort(function(a,b){return (b.ts||0)-(a.ts||0)}).filter(function(r){return r.text}).slice(0,5);

  var th=THEMES.map(function(t){return '<option>'+esc(t)+'</option>'}).join('');
  return '<h1 class="page-h">What shoppers are really asking</h1>'
   +'<p class="lede">Every practice round and every real question you log becomes a datapoint for the Consumer Insights team, ahead of the next survey.</p>'
   +'<div class="stats"><div class="stat"><b>'+pr.length+'</b><span>practice rounds</span></div><div class="stat"><b>'+re.length+'</b><span>real questions logged</span></div>'
   +'<div class="stat"><b>'+avg('diagnose')+'</b><span>avg. asked before pitching</span></div><div class="stat"><b>'+avg('need')+'</b><span>avg. found the real need</span></div></div>'
   +'<div class="sec"><h2>Top shopper concerns</h2>'+bars+split+'</div>'
   +(re.length?'<div class="sec"><h2>What real shoppers did</h2><p>'+rr.closed+' closed on the floor, '+rr.think+' said they would think, '+rr.online+' left to buy online.</p></div>':'')
   +'<div class="sec"><h2>Heard something new on the floor?</h2><p>Log it in ten seconds. No names or phone numbers.</p>'
   +'<div class="logform"><label><span class="lab">Product</span><select id="lgP">'+opts+'</select></label>'
   +'<label><span class="lab">Closest theme</span><select id="lgT">'+th+'</select></label>'

   +'<label><span class="lab">What happened</span><select id="lgR"><option value="closed">Closed on the floor</option><option value="think">Said they would think about it</option><option value="online">Left to buy online</option></select></label>'
   +'<button class="primary" data-act="logreal" style="justify-self:start">Log it</button></div>'
   +(recent.length?'<div class="recent">'+recent.map(function(r){return '<div>'+esc(r.text)+'</div>'}).join('')+'</div>':'')+'</div>'
   +'<div class="sec"><h2>Gaps a pitch cannot fix</h2><p>Tracked from the promoter conversations.</p>'+gapsHtml()+'</div>'
   +'<p class="priv">Only themes, scores and the notes you type here are shared. Practice transcripts stay on your device.'+(S.dbDocs?'':' Team sharing is not available in this view, so you are seeing your own data.')+'</p>';
}

/* ---------- RENDER ---------- */
function render(){
  var keepY=window.scrollY||0;
  document.body.dataset.view=S.tab==='practice'?S.view:S.tab;
  setTabs();
  var h='';
  if(S.tab==='home')h=vLanding();
  else if(S.tab==='practice')h=S.view==='home'?vPractice():S.view==='session'?vSession():vDebrief();
  else if(S.tab==='learn')h=vLearn();else if(S.tab==='guide')h=vGuide();else h=vInsights();
  $('#app').innerHTML=h;
  if(S.tab==='practice'&&S.view==='session'){drawThread();var ta=$('#ta');if(ta)ta.focus({preventScroll:true})}
  else if(S.keep){window.scrollTo(0,keepY)}
  else window.scrollTo(0,0);

}

/* ---------- SHOPPER ---------- */
function shopperPrompt(p,diff){
  var lvl={1:`Friendly: you open up about your home as soon as the promoter asks one sensible question.`,
    2:`Realistic: you answer only what is asked. You reveal your real situation after two sensible open questions about you, not the product.`,
    3:`Tough: you are guarded and in a hurry. If the promoter pitches before asking about you, repeat your main objection. Open up only when asked something that shows they care about your situation. Press on any claim that sounds vague or too good to be true.`}[diff];
  return `You are role-playing a SHOPPER in an Indian electronics retail store so a retail promoter can practise a real conversation. Stay in character at all times and never mention being an AI.\n\n`
   +`Language: natural Hinglish, Hindi written in Roman script mixed with English, the way people actually speak on a shop floor. One to three short sentences per reply. No lists. No stage directions.\n\n`
   +`Who you are: ${p.who}\nStore context: ${p.store}\nYour opening line (already said): ${p.line}\nThings you raise or care about on the surface: ${p.surface.join('; ')}\n`
   +`Your hidden need (never volunteer it; let it out gradually only when the promoter asks about your home, family, routine or what annoys you): ${p.hidden}\n\n`
   +`Difficulty: ${lvl}\n\n`
   +`Behaviour rules:\n- If the promoter lists features without asking about you, get slightly impatient and return to your main objection.\n- If the promoter admits a limitation honestly, trust them more.\n- If the promoter makes a vague or exaggerated claim, push back like a real shopper.\n- If you feel understood and the fit is real, move toward buying: ask to try it, ask about price or how to pay.\n- If you feel pitched at or misled, drift toward leaving or buying online.\n- Never invent specific specs, prices or service facts about SharkNinja products; you are the shopper and you may ask about them. About rival brands speak only in general terms of what shoppers commonly say.\n\n`
   +`Facts the promoter may legitimately know (for reference only, do not recite them):\n${kb()}\n\nReply only as the shopper.`;
}
function buildMsgs(){
  var m=[{role:'user',content:shopperPrompt(S.persona,S.diff)}];
  S.turns.slice(-20).forEach(function(t){m.push({role:t.who==='you'?'user':'assistant',content:t.text})});
  if(m[1]&&m[1].role==='user')m.splice(1,0,{role:'assistant',content:S.persona.line});
  return m;
}
function errCopy(e){
  var c=e&&e.code;
  if(c==='not_granted'){S.ai='off';return `Claude access was declined for this view. Reload and allow it to practise.`}
  if(c==='rate_limited')return `Too many requests at once. Wait a few seconds, then try again.`;
  return `The shopper did not answer.`;
}
async function getReply(){
  S.busy=true;S.lastErr=false;drawThread();setBusy(true);
  ctl=new AbortController();
  try{
    var r=await sampleFn(buildMsgs(),{cache:false,modelTier:'quick',signal:ctl.signal,onText:function(u){var t=$('#typing');if(t){t.classList.remove('wait');t.textContent=u.text}}});
    var txt=String(r.text||'').trim();
    if(!txt)throw {code:'empty'};
    S.turns.push({who:'shopper',text:txt});
    if(S.speak)say(txt);
  }catch(e){
    if(e&&e.code==='cancelled'){}
    else{S.lastErr=errCopy(e)}
  }finally{S.busy=false;setBusy(false);drawThread()}
}
function setBusy(b){var s=$('#sendBtn');if(s)s.disabled=b;var e=$('#endBtn');if(e)e.disabled=b}
async function sendTxt(txt){
  txt=(txt||'').trim();
  if(!txt||S.busy)return;
  if(!sampleFn){toast(`Practice is not available in this view.`);return}
  stopSay();
  S.turns.push({who:'you',text:txt});
  var ta=$('#ta');if(ta){ta.value='';ta.style.height='auto'}
  await getReply();
}

/* ---------- VOICE ---------- */
function say(text){
  try{
    if(!('speechSynthesis' in window))return;
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    var vs=speechSynthesis.getVoices();
    var v=vs.find(function(x){return x.lang==='en-IN'})||vs.find(function(x){return x.lang==='hi-IN'})||null;
    if(v){u.voice=v;u.lang=v.lang}else u.lang='en-IN';
    u.rate=1;speechSynthesis.speak(u);
  }catch(e){}
}
function stopSay(){try{if('speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}}
function stopMic(){try{if(rec)rec.stop()}catch(e){}S.listening=false;var b=$('#micBtn');if(b)b.setAttribute('aria-pressed','false')}
function startMic(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR||S.busy)return;
  var note=$('#micNote'),ta=$('#ta'),btn=$('#micBtn');
  stopSay();micErr='';
  try{
    rec=new SR();rec.lang=S.vlang;rec.interimResults=true;rec.continuous=false;
    var finalT='';
    rec.onresult=function(ev){var t='';for(var i=0;i<ev.results.length;i++){t+=ev.results[i][0].transcript;if(ev.results[i].isFinal)finalT=t}if(ta)ta.value=t};
    rec.onerror=function(ev){
      micErr=(ev.error==='not-allowed'||ev.error==='service-not-allowed')?`Mic is blocked here. Type your reply, or allow the mic for this page.`:`Could not hear that. Try again or type.`;
      if(note)note.textContent=micErr;
    };
    rec.onend=function(){
      S.listening=false;if(btn)btn.setAttribute('aria-pressed','false');
      var t=(ta&&ta.value||'').trim();
      if(t&&!micErr){if(note)note.textContent='';sendTxt(t)}
    };
    rec.start();S.listening=true;btn.setAttribute('aria-pressed','true');if(note)note.textContent=`Listening. Pause when you are done.`;
  }catch(e){if(note)note.textContent=`Voice is not available here. Type your reply.`}
}

/* ---------- COACHING ---------- */
function coachPrompt(){
  var p=S.persona;
  var tr=S.turns.map(function(t){return (t.who==='you'?'PROMOTER: ':'SHOPPER: ')+t.text}).join('\n');
  return `You are a retail sales coach for SharkNinja promoters in India. Coach in plain, warm, direct English. Judge the PROMOTER only. The philosophy: a promoter should be a consumer problem-solver, not a feature-lister. Reward asking before recommending, finding the underlying need, connecting a feature to that specific life, recommending the genuinely right model, and being honest about limits.\n\n`
   +`The shopper persona: ${p.who}\nThe shopper's hidden need (the promoter was not told): ${p.hidden}\nDifficulty level: ${S.diff} of 3\n\n`
   +`Known facts and safe handling (anything the promoter claims beyond this, or that contradicts it, should be flagged for checking):\n${kb()}\n\n`
   +`CONVERSATION:\n${tr}\n\n`
   +`Return ONLY a JSON object with exactly these keys:\n`
   +`{"scores":{"diagnose":{"score":1-5,"note":"one sentence"},"need":{"score":1-5,"note":"one sentence"},"link":{"score":1-5,"note":"one sentence"},"honest":{"score":1-5,"note":"one sentence"}},`
   +`"needFound":true|false,"needNote":"one or two sentences on how the promoter did or did not surface the hidden need",`
   +`"worked":["max 3 specific things, quoting the promoter's own words briefly"],"sharpen":["max 3 specific, actionable improvements"],`
   +`"line":"one stronger line in natural Hinglish (Roman script) the promoter could have said at the key moment",`
   +`"outcome":"would_buy"|"thinking"|"walks",`
   +`"themes":["up to 3 chosen ONLY from this list: ${THEMES.join(' | ')}"],`
   +`"flags":["any claim by the promoter that is not in the known facts, may be unapproved, invents a spec, price, offer or service, or runs down a competitor; empty array if none"]}\n`
   +`Scoring: diagnose = asked about the shopper before pitching; need = surfaced the hidden need; link = tied features to their life rather than listing; honest = admitted limits and made no unsupported claims. Be fair: a short conversation caps what can be shown. Do not praise what did not happen.`;
}
function norm(d){
  var sc={};DIMS.forEach(function(x){var s=(d.scores&&d.scores[x.k])||{};sc[x.k]={score:clamp(s.score),note:String(s.note||'')}});
  var arr=function(a,n){return (Array.isArray(a)?a:[]).slice(0,n).map(String).filter(Boolean)};
  return {scores:sc,needFound:!!d.needFound,needNote:String(d.needNote||''),worked:arr(d.worked,3),sharpen:arr(d.sharpen,3),line:String(d.line||''),
    outcome:({would_buy:1,thinking:1,walks:1}[d.outcome]?d.outcome:'thinking'),themes:arr(d.themes,3).filter(function(t){return THEMES.indexOf(t)>-1}),flags:arr(d.flags,4)};
}
async function runCoach(){
  S.coaching=true;S.coachErr=null;S.debrief=null;S.saved=false;render();
  try{
    var raw=await sampleFn.json(coachPrompt(),{modelTier:'default',cache:false});
    S.debrief=norm(raw||{});
    if(!S.saved){
      S.saved=true;
      var r=S.debrief;
      saveRec({type:'practice',persona:S.persona.id,cat:S.persona.cat,diff:S.diff,outcome:r.outcome,
        scores:{diagnose:r.scores.diagnose.score,need:r.scores.need.score,link:r.scores.link.score,honest:r.scores.honest.score},themes:r.themes});
    }
  }catch(e){
    S.coachErr=(e&&e.code==='not_granted')?`Claude access was declined for this view.`:(e&&e.code==='rate_limited')?`Too many requests at once. Wait a few seconds and try again.`:`Something went wrong reading the conversation. Your practice chat is still here.`;
  }
  S.coaching=false;
  if(S.tab==='practice'&&S.view==='debrief')render();
}
function saveRec(r){
  r.ts=Date.now();
  S.hist.push(r);
  try{localStorage.setItem('fr_hist',JSON.stringify(S.hist.slice(-200)))}catch(e){}
  if(dbRef){try{dbRef.collection('sessions').add(r).catch(function(){})}catch(e){}}
}

/* ---------- ACTIONS ---------- */
function startSession(id){
  if(S.tab==='home')S.origin='home';
  S.tab='practice';
  S.persona=PERSONAS.find(function(p){return p.id===id});if(!S.persona)return;
  S.turns=[{who:'shopper',text:S.persona.line}];S.view='session';S.busy=false;S.lastErr=false;S.debrief=null;S.saved=false;micErr='';
  render();if(S.speak)say(S.persona.line);
}
/* live chat needs Claude. When it is off, send the shopper to the drills for that product */
function toDrills(personaId){
  var pp=PERSONA_PROD[personaId];
  S.tab='practice';S.view='home';S.pmode='drills';
  if(pp&&pp!=='any'){S.dprod=pp}
  S.didx=0;S.dpick=null;render();
  toast(`Live chat runs only inside Claude. Here are question drills instead.`);
}
var KEEP=['dpick','dretry','yrs','tg','cmp','pprod','pmode','dprod','didx','gcat','lcat','gseg','lseg'];
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act;S.keep=KEEP.indexOf(a)>-1;
  switch(a){
    case 'tab':S.tab=t.dataset.tab;if(S.tab==='practice'&&S.view==='debrief'&&!S.coaching)S.view='home';render();break;
    case 'chip':var qi=$('#q');if(qi){qi.value=t.dataset.q;$('#sres').innerHTML=searchHtml(qi.value);qi.focus()}break;
    case 'diff':S.diff=+t.dataset.n;render();break;
    case 'cat':S.cat=t.dataset.c;render();break;
    case 'surprise':
      var pool=PERSONAS.filter(function(p){var pp=PERSONA_PROD[p.id];return pp&&(S.cat==='all'||p.cat===S.cat)&&(S.pprod==='all'||pp===S.pprod||pp==='any')});
      if(!pool.length)break;
      var pick=pool[Math.floor(Math.random()*pool.length)].id;
      if(S.ai==='off'){toDrills(pick);break}
      startSession(pick);break;
    case 'start':if(S.ai==='off'){toDrills(t.dataset.id);break}startSession(t.dataset.id);break;
    case 'leave':stopSay();stopMic();if(ctl)try{ctl.abort()}catch(x){}S.view='home';S.busy=false;if(S.origin==='home'){S.tab='home';S.origin=null}render();break;
    case 'speak':S.speak=!S.speak;t.setAttribute('aria-pressed',String(S.speak));if(!S.speak)stopSay();break;
    case 'send':sendTxt($('#ta').value);break;
    case 'retry':getReply();break;
    case 'mic':if(S.listening)stopMic();else startMic();break;
    case 'vlang':S.vlang=S.vlang==='en-IN'?'hi-IN':'en-IN';t.textContent='Voice: '+(S.vlang==='en-IN'?'English / Hinglish':'Hindi');break;
    case 'hint':var ta=$('#ta');if(ta){ta.value=HINTS[Math.floor(Math.random()*HINTS.length)];ta.focus()}break;
    case 'end':
      var n=S.turns.filter(function(x){return x.who==='you'}).length;
      if(n<2){toast(`Say a bit more first. Coaching needs at least two replies from you.`);break}
      stopSay();stopMic();S.view='debrief';runCoach();break;
    case 'recoach':runCoach();break;
    case 'again':startSession(S.persona.id);break;
    case 'pmode':S.pmode=t.dataset.k;render();break;
    case 'pprod':S.pprod=t.dataset.c;render();break;
    case 'dprod':S.dprod=t.dataset.p;S.didx=0;S.dpick=null;render();break;
    case 'didx':S.didx=+t.dataset.i;S.dpick=null;render();break;
    case 'dpick':
      var dl=drillsFor(S.dprod),dd=dl[S.didx];S.dpick=+t.dataset.i;
      S.dscore[S.dprod+':'+S.didx]=dd.opts[S.dpick].v;
      render();var fbe=$('.fb');if(fbe)fbe.scrollIntoView({block:'nearest'});break;
    case 'dnext':S.didx=(S.didx+1)%drillsFor(S.dprod).length;S.dpick=null;render();break;
    case 'dretry':S.dpick=null;delete S.dscore[S.dprod+':'+S.didx];render();break;
    case 'cmp':S.cmp=t.dataset.k;render();break;
    case 'tg':S.tg=t.dataset.g;render();break;
    case 'yrs':S.yrs=+t.dataset.y;render();break;
    case 'gseg':S.gseg=t.dataset.k;render();break;
    case 'gcat':S.gcat=t.dataset.c;render();break;
    case 'lseg':S.lseg=t.dataset.k;render();break;
    case 'lcat':S.lcat=t.dataset.c;render();break;
    case 'learnprac':if(S.ai==='off'){toDrills(t.dataset.id);break}S.tab='practice';startSession(t.dataset.id);break;
    case 'logreal':
      var theme=$('#lgT').value,prod=$('#lgP').value,txt=$('#lgX').value.trim().slice(0,240),res=$('#lgR').value;
      saveRec({type:'real',product:prod,theme:theme,text:txt,result:res});toast(`Logged. Thank you.`);render();break;
  }
});
document.addEventListener('keydown',function(e){
  if(e.target&&e.target.id==='ta'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendTxt(e.target.value)}
});
document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='ta'){e.target.style.height='auto';e.target.style.height=Math.min(130,e.target.scrollHeight)+'px'}
  if(e.target&&e.target.id==='q'){var r=$('#sres');if(r)r.innerHTML=searchHtml(e.target.value)}
});

/* ---------- CAPABILITIES ---------- */
(async function(){
  render();
  try{
    if(window.claude&&window.claude.use){
      sampleFn=await window.claude.use('sample');
      S.ai=sampleFn?'ok':'off';
      try{
        var db=await window.claude.use('db');
        if(db){
          dbRef=db;
          db.collection('sessions').orderBy('ts','desc').limit(500).onSnapshot(function(snap){
            S.dbDocs=snap.docs.map(function(d){return d.data()});
            if(S.tab==='insights'||(S.tab==='home'&&!($('#q')&&$('#q').value)))render();
          },function(){S.dbDocs=null});
        }
      }catch(e){}
    }else S.ai='off';
  }catch(e){S.ai='off'}
  var qq=$('#q');if(S.view!=='session'&&!S.coaching&&!(qq&&qq.value))render();
})();
})();
</script>
</body>
