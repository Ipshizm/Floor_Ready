<title>Floor Ready</title>
<style>
/* Layout: mobile-first app with bottom dock, top tabs on desktop; SharkNinja teal/black/white/silver */
:root{
  --bg:#ffffff; --surface:#f2f3f4; --surface-2:#e4e5e7; --ink:#000000; --muted:#4b4c4e;
  --line:#d3d4d6; --teal:#00a5af; --on-teal:#000000; --accent-text:#000000;
  --warn:#e74c39; --ok:#97c93c; --chip-a-bg:#000000; --chip-a-ink:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#171717; --surface-2:#2a2a2a; --ink:#ffffff; --muted:#bbbdc0;
    --line:#333333; --accent-text:#00a5af; --chip-a-bg:#ffffff; --chip-a-ink:#000000; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#171717; --surface-2:#2a2a2a; --ink:#ffffff; --muted:#bbbdc0;
  --line:#333333; --accent-text:#00a5af; --chip-a-bg:#ffffff; --chip-a-ink:#000000; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 "Proxima Nova","Gotham","Helvetica Neue",Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding-inline:20px}
h1,h2,h3,p{margin:0}
.pivot{display:inline-block;width:30px;height:10px;background:var(--teal);transform:skewX(-24deg);flex:none}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;height:56px}
.mark{display:flex;align-items:center;gap:12px;font-weight:700;font-size:20px;letter-spacing:0;background:none;border:0;padding:0;color:var(--ink)}
.tabs{display:none;gap:4px}
.tab{background:none;border:0;padding:8px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--teal)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock button{background:none;border:0;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:12.5px;font-weight:600;color:var(--muted)}
.dock button[aria-current="page"]{color:var(--ink)}
.dock button[aria-current="page"] svg{stroke:var(--teal)}
.dock svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
body[data-view="session"] .dock{display:none}
@media (min-width:780px){.tabs{display:flex}.dock{display:none}}

main{padding-top:28px;padding-bottom:110px;min-height:70vh}
body[data-view="session"] main{padding-top:0;padding-bottom:0}
@media (min-width:780px){main{padding-bottom:64px}}

/* hero */
.hero h1{font-size:clamp(30px,7.2vw,48px);line-height:1.04;font-weight:700;max-width:16em}
.lede{margin-top:14px;color:var(--muted);max-width:34em;font-size:17px}
.controls{margin:26px 0 8px;display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:6px}
.lab{font-size:13px;font-weight:600;color:var(--muted)}
.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--ink);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--on-teal)}
.ghost{background:none;border:1.5px solid var(--ink);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px}
.ghost:hover{border-color:var(--teal)}
.primary{background:var(--teal);color:var(--on-teal);border:0;border-radius:999px;padding:11px 22px;font-weight:700}
.primary:disabled{opacity:.45;cursor:not-allowed}
.banner{margin:18px 0 0;padding:12px 16px;border-left:4px solid var(--warn);background:var(--surface);font-size:15px}

/* persona cards */
.personas{display:grid;gap:14px;margin-top:20px;grid-template-columns:1fr}
@media (min-width:640px){.personas{grid-template-columns:1fr 1fr}}
.pcard{position:relative;text-align:left;background:var(--surface);border:1.5px solid transparent;border-radius:4px 18px 18px 4px;
  padding:18px 18px 16px 26px;display:flex;flex-direction:column;gap:10px;min-height:210px;min-width:0}
.pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--teal);clip-path:polygon(0 0,100% 0,35% 100%,0 100%)}
.pcard:hover{border-color:var(--teal)}
.pcard-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 10px;border-radius:999px}
.chip.shark{background:var(--chip-a-bg);color:var(--chip-a-ink)}
.chip.ninja{background:var(--teal);color:#000}
.vs{font-size:13px;color:var(--muted);font-weight:600}
.pcard-quote{font-size:19px;line-height:1.28;font-weight:600}
.pcard-name{font-weight:700;margin-top:auto}
.pcard-store{font-size:13.5px;color:var(--muted);margin-top:-6px}

/* session */
.session{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.s-top{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:10px 0}
.s-title{flex:1;min-width:0}
.s-title b{display:block;font-size:16px;line-height:1.2}
.s-title span{font-size:13px;color:var(--muted)}
.icon-btn{background:none;border:1.5px solid var(--line);border-radius:999px;width:42px;height:42px;display:grid;place-items:center;flex:none}
.icon-btn[aria-pressed="true"]{border-color:var(--teal);background:var(--teal);color:#000}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.brief{margin:14px 0 6px;padding:10px 14px;border-left:4px solid var(--teal);background:var(--surface);font-size:14px;color:var(--muted)}
.thread{flex:1;padding:14px 0 18px}
.b{max-width:88%;padding:10px 14px;border-radius:16px;margin:0 0 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.b.shopper{background:var(--surface);border-bottom-left-radius:4px}
.b.you{background:var(--teal);color:#000;margin-left:auto;border-bottom-right-radius:4px}
.b.wait{color:var(--muted);font-style:italic}
.note{font-size:14px;color:var(--muted);margin:0 0 12px;padding:10px 14px;border:1px dashed var(--line);border-radius:10px}
.note button{background:none;border:0;padding:0;text-decoration:underline;font-weight:600}
.composer{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.c-row{display:flex;gap:8px;align-items:flex-end}
.c-row textarea{flex:1;min-width:0;resize:none;min-height:46px;max-height:130px;border:1.5px solid var(--line);border-radius:23px;padding:11px 16px;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.35}
.c-row textarea:focus{border-color:var(--teal);outline:none}
.c-tools{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.linkish{background:none;border:0;padding:0;font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.end-btn{margin-left:auto}
.micnote{font-size:13px;color:var(--muted)}

/* debrief */
.deb h1{font-size:clamp(28px,6.4vw,42px);line-height:1.06;font-weight:700;max-width:17em}
.deb .sub{margin-top:10px;color:var(--muted)}
.scores{margin:28px 0 8px;display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:640px){.scores{grid-template-columns:1fr 1fr}}
.sc{border-top:3px solid var(--teal);padding-top:10px}
.sc-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sc-h b{font-size:15px}
.sc p{margin-top:6px;font-size:14.5px;color:var(--muted)}
.meter{display:inline-flex;gap:4px}
.meter i{width:20px;height:9px;background:var(--surface-2);transform:skewX(-24deg)}
.meter i.on{background:var(--teal)}
@media (prefers-reduced-motion:no-preference){
  .deb .meter i.on{animation:fill .5s both}
  .deb .meter i:nth-child(2){animation-delay:.08s}.deb .meter i:nth-child(3){animation-delay:.16s}
  .deb .meter i:nth-child(4){animation-delay:.24s}.deb .meter i:nth-child(5){animation-delay:.32s}
  @keyframes fill{from{background:var(--surface-2)}to{background:var(--teal)}}
}
.reveal{margin:26px 0;border:1.5px solid var(--ink)}
.reveal summary{list-style:none;cursor:pointer;padding:16px 18px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:12px;
  background:repeating-linear-gradient(-45deg,var(--teal) 0 12px,var(--bg) 12px 24px);color:#000}
.reveal summary span{background:var(--bg);color:var(--ink);padding:4px 12px;border-radius:999px;font-size:14px}
.reveal summary::-webkit-details-marker{display:none}
.reveal[open] summary{background:var(--teal)}
.reveal .rv{padding:16px 18px;display:grid;gap:10px}
.found{font-weight:700}
.two{display:grid;gap:22px;grid-template-columns:1fr;margin-top:6px}
@media (min-width:640px){.two{grid-template-columns:1fr 1fr}}
.two h3,.h3{font-size:17px;font-weight:700;margin-bottom:8px}
ul.clean{margin:0;padding-left:18px;display:grid;gap:8px}
.say{margin-top:24px;padding:18px 20px;background:var(--surface);border-left:6px solid var(--teal)}
.say q{display:block;font-size:20px;font-weight:600;line-height:1.3;quotes:"“" "”";margin-top:6px}
.flag{margin-top:22px;padding:14px 16px;border-left:4px solid var(--warn);background:var(--surface)}
.themes{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.theme{border:1.5px solid var(--line);border-radius:999px;padding:3px 12px;font-size:14px;font-weight:600}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.loading{padding:56px 0;display:grid;gap:14px;justify-items:start}
.loading .pivot{width:64px}

/* guide */
.page-h{font-size:clamp(26px,5.6vw,38px);line-height:1.08;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.fchip{border:1.5px solid var(--line);background:none;border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.prod{border:1.5px solid var(--line);margin:0 0 14px;border-radius:4px 16px 16px 4px;overflow:hidden}
.prod>summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.prod>summary::-webkit-details-marker{display:none}
.prod>summary b{font-size:18px;display:block;line-height:1.2}
.prod>summary small{color:var(--muted);font-size:14px}
.prod[open]>summary{border-bottom:1px solid var(--line);background:var(--surface)}
.facts{padding:14px 18px 4px;font-size:14.5px}
.facts ul{margin:0;padding-left:18px;display:grid;gap:4px}
.confirm{margin:10px 18px 4px;font-size:13.5px;color:var(--muted)}
.qs{padding:8px 18px 18px}
.q{border-top:1px solid var(--line)}
.q summary{list-style:none;cursor:pointer;padding:14px 0;display:grid;gap:2px}
.q summary::-webkit-details-marker{display:none}
.q summary b{font-weight:600;font-size:16.5px}
.q summary small{color:var(--muted);font-size:13.5px}
.q .qb{padding:0 0 16px;display:grid;gap:12px}
.qb .lab{margin-bottom:2px}
.qb .sayline{padding:10px 14px;background:var(--surface);border-left:4px solid var(--teal);font-weight:600}
.qb .care{padding:10px 14px;border-left:4px solid var(--warn);background:var(--surface);font-size:15px}
.vcard{border:1.5px solid var(--line);padding:18px;margin-bottom:14px;border-radius:4px 16px 16px 4px;display:grid;gap:12px}
.vcard h3{font-size:19px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag-warn{font-size:12.5px;font-weight:700;background:var(--warn);color:#000;border-radius:999px;padding:2px 10px}
.gap{display:grid;gap:4px;padding:14px 0;border-top:1px solid var(--line)}
.gap b{font-size:16.5px}
.gap .st{justify-self:start;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--surface-2)}

/* insights */
.stats{display:grid;gap:14px;grid-template-columns:1fr 1fr;margin:22px 0}
@media (min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{border-top:3px solid var(--teal);padding-top:8px}
.stat b{font-size:34px;line-height:1;font-weight:700;display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:13.5px;color:var(--muted)}
.bars{display:grid;gap:10px;margin:12px 0 4px}
.bar{display:grid;grid-template-columns:minmax(120px,38%) 1fr 28px;gap:10px;align-items:center;font-size:14.5px}
.bar i{display:block;height:12px;background:var(--teal);transform:skewX(-24deg);transform-origin:left}
.bar em{font-style:normal;font-weight:700;text-align:right}
.split{display:flex;height:16px;margin:10px 0 6px}
.split i{display:block;height:100%}
.sec{margin-top:36px}
.sec h2{font-size:22px;font-weight:700}
.sec>p{color:var(--muted);margin-top:4px}
.logform{display:grid;gap:12px;margin-top:14px;padding:18px;background:var(--surface);border-radius:4px 16px 16px 4px;border-left:6px solid var(--teal)}
.logform select,.logform textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--ink);font-size:16px}
.logform textarea{min-height:70px;resize:vertical}
.priv{margin-top:26px;font-size:13.5px;color:var(--muted)}
.recent{display:grid;gap:8px;margin-top:14px}
.recent div{padding:10px 14px;border-left:4px solid #bbbdc0;background:var(--surface);font-size:15px}
.empty{padding:22px;border:1.5px dashed var(--line);border-radius:12px;color:var(--muted)}
/* landing */
.land h1{font-size:clamp(34px,8.4vw,58px);line-height:1.0;font-weight:700;max-width:11em}
.land .hi{margin-top:10px;color:var(--muted);font-size:17px;max-width:30em}
.sbox{position:relative;margin-top:24px}
.sbox label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
.sfield{position:relative}
.sfield svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}
.sfield input{width:100%;border:2px solid var(--ink);border-radius:999px;padding:15px 20px 15px 52px;font-size:17px;background:var(--bg);color:var(--ink)}
.sfield input:focus{border-color:var(--teal);outline:3px solid rgba(0,165,175,.35);outline-offset:0}
.sugg{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sres{margin-top:12px}
.sres:empty{display:none}
.sres .inner{border:1.5px solid var(--line);border-radius:4px 16px 16px 4px;padding:2px 16px 4px}
.sres .q:first-child{border-top:0}
.today{position:relative;margin-top:28px;background:var(--teal);color:#000;padding:24px 24px 34px;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 24px),calc(100% - 44px) 100%,0 100%)}
.today .lab{color:#000;opacity:.78;font-size:14px;font-weight:600}
.today q{display:block;font-size:clamp(23px,5.8vw,34px);line-height:1.16;font-weight:700;margin:10px 0 8px;quotes:"\201C" "\201D";max-width:20em}
.today .who{font-size:15px;max-width:34em}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn-black{background:#000;color:#fff;border:2px solid #000;border-radius:999px;padding:12px 22px;font-weight:700}
.btn-line{background:none;color:#000;border:2px solid #000;border-radius:999px;padding:12px 22px;font-weight:700}
.btn-black:focus-visible,.btn-line:focus-visible{outline-color:#000}
.tiles{display:grid;gap:12px;margin-top:22px;grid-template-columns:1fr}
@media (min-width:640px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;text-align:left;display:grid;grid-template-columns:44px 1fr;gap:6px 14px;align-items:center;background:var(--surface);
  border:1.5px solid transparent;border-radius:4px 18px 18px 4px;padding:16px 16px 16px 24px;min-width:0}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:9px;background:var(--teal);clip-path:polygon(0 0,100% 0,35% 100%,0 100%)}
.tile:hover{border-color:var(--teal)}
.tile .ti svg{width:34px;height:34px;fill:none;stroke:var(--teal);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
.tile .tt{display:block}
.tile b{display:block;font-size:19px;line-height:1.15}
.tile .d{display:block;font-size:14.5px;color:var(--muted);margin-top:3px}
.tile .m{display:block;font-size:13px;font-weight:700;margin-top:6px}
@media (min-width:640px){.tile{grid-template-columns:1fr;align-items:start;min-height:200px}.tile .ti{margin-bottom:6px}}
.resume{margin-top:26px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--line);font-size:15px}
.resume span{color:var(--muted)}
/* learn */
.lsec{padding:16px 18px 4px}
.lsec h3{font-size:16px;font-weight:700;margin:0 0 8px}
.lsec p{margin:0}
.specs{display:grid;grid-template-columns:1fr;margin:0}
@media (min-width:640px){.specs{grid-template-columns:1fr 1fr;column-gap:26px}}
.specs div{padding:9px 0;border-top:1px solid var(--line)}
.specs dt{font-size:13px;font-weight:600;color:var(--muted)}
.specs dd{margin:0;font-size:15.5px}
.specs dd em{font-style:normal;color:var(--muted);font-size:13px}
.feat{padding:12px 14px;border-left:4px solid var(--teal);background:var(--surface);margin-bottom:10px}
.feat b{display:block}
.feat p{margin:2px 0 0;font-size:15px}
.feat .gain{font-weight:600;margin-top:6px}
.fitgrid{display:grid;gap:18px;grid-template-columns:1fr}
@media (min-width:640px){.fitgrid{grid-template-columns:1fr 1fr}}
.flagbox{margin:12px 18px 0;padding:12px 14px;border-left:4px solid var(--warn);background:var(--surface);font-size:15px}
.flagbox b{display:block;margin-bottom:4px}
.flagbox ul{margin:0;padding-left:18px;display:grid;gap:4px}
.lact{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:16px 18px 18px}
.srcnote{font-size:13px;color:var(--muted)}
.tbl{overflow-x:auto;margin:14px 0 24px;border:1.5px solid var(--line)}
.tbl table{border-collapse:collapse;min-width:720px;width:100%;font-size:14.5px}
.tbl th,.tbl td{padding:10px 12px;text-align:left;vertical-align:top;border-top:1px solid var(--line)}
.tbl thead th{border-top:0;background:var(--surface);font-weight:700}
.tbl th[scope="row"]{position:sticky;left:0;background:var(--surface);font-weight:600;min-width:120px}
.need{display:grid;gap:2px;padding:12px 0;border-top:1px solid var(--line)}
.need b{font-size:16.5px}
.need span{color:var(--muted);font-size:15px}
.terms{margin:0}
.terms dt{font-weight:700;margin-top:16px}
.terms dd{margin:2px 0 0;color:var(--muted)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:999px;font-size:14.5px;font-weight:600;z-index:60;max-width:90vw;display:none}
</style>

<header class="top"><div class="wrap top-in">
  <button class="mark" data-act="tab" data-tab="home" aria-label="Floor Ready home"><span class="pivot"></span>Floor Ready</button>
  <nav class="tabs" id="tabsTop" aria-label="Sections"></nav>
</div></header>
<main id="app" class="wrap"></main>
<nav class="dock" id="tabsDock" aria-label="Sections"></nav>
<div id="toast" role="status"></div>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)};

function searchHtml(v){
  v=(v||'').trim().toLowerCase();if(!v)return '';
  if(!SIDX)buildIdx();
  var groups=v.split(/\s+/).filter(Boolean).map(function(t){return [t].concat((SYN[t]||'').split(' ').filter(Boolean))});
  var hits=SIDX.map(function(it){var sc=0;groups.forEach(function(g){if(g.some(function(w){return it.h.indexOf(w)>-1}))sc++});return {it:it,sc:sc}}).filter(function(x){return x.sc>0});
  var full=hits.filter(function(x){return x.sc===groups.length});
  var use=(full.length?full:hits).sort(function(a,b){return b.sc-a.sc}).slice(0,6);
  if(!use.length)return '<div class="empty">Nothing matches &ldquo;'+esc(v)+'&rdquo;. Try EMI, weight, service, plastic or battery. Heard something new? <button class="linkish" data-act="tab" data-tab="insights">Log it</button></div>';
  return '<div class="inner">'+use.map(function(x,i){var q=x.it;

/* ---------- SHOPPER ---------- */
function shopperPrompt(p,diff){
  var lvl={1:`Friendly: you open up about your home as soon as the promoter asks one sensible question.`,
    2:`Realistic: you answer only what is asked. You reveal your real situation after two sensible open questions about you, not the product.`,
    3:`Tough: you are guarded and in a hurry. If the promoter pitches before asking about you, repeat your main objection. Open up only when asked something that shows they care about your situation. Press on any claim that sounds vague or too good to be true.`}[diff];
  return `You are role-playing a SHOPPER in an Indian electronics retail store so a retail promoter can practise a real conversation. Stay in character at all times and never mention being an AI.\n\n`
   +`Language: natural Hinglish, Hindi written in Roman script mixed with English, the way people actually speak on a shop floor. One to three short sentences per reply. No lists. No stage directions.\n\n`
   +`Who you are: ${p.who}\nStore context: ${p.store}\nYour opening line (already said): ${p.line}\nThings you raise or care about on the surface: ${p.surface.join('; ')}\n`
   +`Your hidden need (never volunteer it; let it out gradually only when the promoter asks about your home, family, routine or what annoys you): ${p.hidden}\n\n`
   +`Difficulty: ${lvl}\n\n`
   +`Behaviour rules:\n- If the promoter lists features without asking about you, get slightly impatient and return to your main objection.\n- If the promoter admits a limitation honestly, trust them more.\n- If the promoter makes a vague or exaggerated claim, push back like a real shopper.\n- If you feel understood and the fit is real, move toward buying: ask to try it, ask about price or how to pay.\n- If you feel pitched at or misled, drift toward leaving or buying online.\n- Never invent specific specs, prices or service facts about SharkNinja products; you are the shopper and you may ask about them. About rival brands speak only in general terms of what shoppers commonly say.\n\n`
   +`Facts the promoter may legitimately know (for reference only, do not recite them):\n${kb()}\n\nReply only as the shopper.`;
}
function buildMsgs(){
  var m=[{role:'user',content:shopperPrompt(S.persona,S.diff)}];
  S.turns.slice(-20).forEach(function(t){m.push({role:t.who==='you'?'user':'assistant',content:t.text})});
  if(m[1]&&m[1].role==='user')m.splice(1,0,{role:'assistant',content:S.persona.line});
  return m;
}
function errCopy(e){
  var c=e&&e.code;
  if(c==='not_granted'){S.ai='off';return `Claude access was declined for this view. Reload and allow it to practise.`}
  if(c==='rate_limited')return `Too many requests at once. Wait a few seconds, then try again.`;
  return `The shopper did not answer.`;
}
async function getReply(){
  S.busy=true;S.lastErr=false;drawThread();setBusy(true);
  ctl=new AbortController();
  try{
    var r=await sampleFn(buildMsgs(),{cache:false,modelTier:'quick',signal:ctl.signal,onText:function(u){var t=$('#typing');if(t){t.classList.remove('wait');t.textContent=u.text}}});
    var txt=String(r.text||'').trim();
    if(!txt)throw {code:'empty'};
    S.turns.push({who:'shopper',text:txt});
    if(S.speak)say(txt);
  }catch(e){
    if(e&&e.code==='cancelled'){}
    else{S.lastErr=errCopy(e)}
  }finally{S.busy=false;setBusy(false);drawThread()}
}
function setBusy(b){var s=$('#sendBtn');if(s)s.disabled=b;var e=$('#endBtn');if(e)e.disabled=b}
async function sendTxt(txt){
  txt=(txt||'').trim();
  if(!txt||S.busy)return;
  if(!sampleFn){toast(`Practice is not available in this view.`);return}
  stopSay();
  S.turns.push({who:'you',text:txt});
  var ta=$('#ta');if(ta){ta.value='';ta.style.height='auto'}
  await getReply();
}

/* ---------- VOICE ---------- */
function say(text){
  try{
    if(!('speechSynthesis' in window))return;
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    var vs=speechSynthesis.getVoices();
    var v=vs.find(function(x){return x.lang==='en-IN'})||vs.find(function(x){return x.lang==='hi-IN'})||null;
    if(v){u.voice=v;u.lang=v.lang}else u.lang='en-IN';
    u.rate=1;speechSynthesis.speak(u);
  }catch(e){}
}
function stopSay(){try{if('speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}}
function stopMic(){try{if(rec)rec.stop()}catch(e){}S.listening=false;var b=$('#micBtn');if(b)b.setAttribute('aria-pressed','false')}
function startMic(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR||S.busy)return;
  var note=$('#micNote'),ta=$('#ta'),btn=$('#micBtn');
  stopSay();micErr='';
  try{
    rec=new SR();rec.lang=S.vlang;rec.interimResults=true;rec.continuous=false;
    var finalT='';
    rec.onresult=function(ev){var t='';for(var i=0;i<ev.results.length;i++){t+=ev.results[i][0].transcript;if(ev.results[i].isFinal)finalT=t}if(ta)ta.value=t};
    rec.onerror=function(ev){
      micErr=(ev.error==='not-allowed'||ev.error==='service-not-allowed')?`Mic is blocked here. Type your reply, or allow the mic for this page.`:`Could not hear that. Try again or type.`;
      if(note)note.textContent=micErr;
    };
    rec.onend=function(){
      S.listening=false;if(btn)btn.setAttribute('aria-pressed','false');
      var t=(ta&&ta.value||'').trim();
      if(t&&!micErr){if(note)note.textContent='';sendTxt(t)}
    };
    rec.start();S.listening=true;btn.setAttribute('aria-pressed','true');if(note)note.textContent=`Listening. Pause when you are done.`;
  }catch(e){if(note)note.textContent=`Voice is not available here. Type your reply.`}
}

/* ---------- COACHING ---------- */
function coachPrompt(){
  var p=S.persona;
  var tr=S.turns.map(function(t){return (t.who==='you'?'PROMOTER: ':'SHOPPER: ')+t.text}).join('\n');
  return `You are a retail sales coach for SharkNinja promoters in India. Coach in plain, warm, direct English. Judge the PROMOTER only. The philosophy: a promoter should be a consumer problem-solver, not a feature-lister. Reward asking before recommending, finding the underlying need, connecting a feature to that specific life, recommending the genuinely right model, and being honest about limits.\n\n`
   +`The shopper persona: ${p.who}\nThe shopper's hidden need (the promoter was not told): ${p.hidden}\nDifficulty level: ${S.diff} of 3\n\n`
   +`Known facts and safe handling (anything the promoter claims beyond this, or that contradicts it, should be flagged for checking):\n${kb()}\n\n`
   +`CONVERSATION:\n${tr}\n\n`
   +`Return ONLY a JSON object with exactly these keys:\n`
   +`{"scores":{"diagnose":{"score":1-5,"note":"one sentence"},"need":{"score":1-5,"note":"one sentence"},"link":{"score":1-5,"note":"one sentence"},"honest":{"score":1-5,"note":"one sentence"}},`
   +`"needFound":true|false,"needNote":"one or two sentences on how the promoter did or did not surface the hidden need",`
   +`"worked":["max 3 specific things, quoting the promoter's own words briefly"],"sharpen":["max 3 specific, actionable improvements"],`
   +`"line":"one stronger line in natural Hinglish (Roman script) the promoter could have said at the key moment",`
   +`"outcome":"would_buy"|"thinking"|"walks",`
   +`"themes":["up to 3 chosen ONLY from this list: ${THEMES.join(' | ')}"],`
   +`"flags":["any claim by the promoter that is not in the known facts, may be unapproved, invents a spec, price, offer or service, or runs down a competitor; empty array if none"]}\n`
   +`Scoring: diagnose = asked about the shopper before pitching; need = surfaced the hidden need; link = tied features to their life rather than listing; honest = admitted limits and made no unsupported claims. Be fair: a short conversation caps what can be shown. Do not praise what did not happen.`;
}
function norm(d){
  var sc={};DIMS.forEach(function(x){var s=(d.scores&&d.scores[x.k])||{};sc[x.k]={score:clamp(s.score),note:String(s.note||'')}});
  var arr=function(a,n){return (Array.isArray(a)?a:[]).slice(0,n).map(String).filter(Boolean)};
  return {scores:sc,needFound:!!d.needFound,needNote:String(d.needNote||''),worked:arr(d.worked,3),sharpen:arr(d.sharpen,3),line:String(d.line||''),
    outcome:({would_buy:1,thinking:1,walks:1}[d.outcome]?d.outcome:'thinking'),themes:arr(d.themes,3).filter(function(t){return THEMES.indexOf(t)>-1}),flags:arr(d.flags,4)};
}
async function runCoach(){
  S.coaching=true;S.coachErr=null;S.debrief=null;S.saved=false;render();
  try{
    var raw=await sampleFn.json(coachPrompt(),{modelTier:'default',cache:false});
    S.debrief=norm(raw||{});
    if(!S.saved){
      S.saved=true;
      var r=S.debrief;
      saveRec({type:'practice',persona:S.persona.id,cat:S.persona.cat,diff:S.diff,outcome:r.outcome,
        scores:{diagnose:r.scores.diagnose.score,need:r.scores.need.score,link:r.scores.link.score,honest:r.scores.honest.score},themes:r.themes});
    }
  }catch(e){
    S.coachErr=(e&&e.code==='not_granted')?`Claude access was declined for this view.`:(e&&e.code==='rate_limited')?`Too many requests at once. Wait a few seconds and try again.`:`Something went wrong reading the conversation. Your practice chat is still here.`;
  }
  S.coaching=false;
  if(S.tab==='practice'&&S.view==='debrief')render();
}
function saveRec(r){
  r.ts=Date.now();
  S.hist.push(r);
  try{localStorage.setItem('fr_hist',JSON.stringify(S.hist.slice(-200)))}catch(e){}
  if(dbRef){try{dbRef.collection('sessions').add(r).catch(function(){})}catch(e){}}
}

/* ---------- ACTIONS ---------- */
function startSession(id){
  if(S.tab==='home')S.origin='home';
  S.tab='practice';
  S.persona=PERSONAS.find(function(p){return p.id===id});if(!S.persona)return;
  S.turns=[{who:'shopper',text:S.persona.line}];S.view='session';S.busy=false;S.lastErr=false;S.debrief=null;S.saved=false;micErr='';
  render();if(S.speak)say(S.persona.line);
}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act;
  switch(a){
    case 'tab':S.tab=t.dataset.tab;if(S.tab==='practice'&&S.view==='debrief'&&!S.coaching)S.view='home';render();break;
    case 'chip':var qi=$('#q');if(qi){qi.value=t.dataset.q;$('#sres').innerHTML=searchHtml(qi.value);qi.focus()}break;
    case 'diff':S.diff=+t.dataset.n;render();break;
    case 'cat':S.cat=t.dataset.c;render();break;
    case 'surprise':if(S.ai==='off'){toast(`Practice is not available in this view.`);break}
      var pool=PERSONAS.filter(function(p){return S.cat==='all'||p.cat===S.cat});startSession(pool[Math.floor(Math.random()*pool.length)].id);break;
    case 'start':if(S.ai==='off'){toast(`Practice is not available in this view.`);break}startSession(t.dataset.id);break;
    case 'leave':stopSay();stopMic();if(ctl)try{ctl.abort()}catch(x){}S.view='home';S.busy=false;if(S.origin==='home'){S.tab='home';S.origin=null}render();break;
    case 'speak':S.speak=!S.speak;t.setAttribute('aria-pressed',String(S.speak));if(!S.speak)stopSay();break;
    case 'send':sendTxt($('#ta').value);break;
    case 'retry':getReply();break;
    case 'mic':if(S.listening)stopMic();else startMic();break;
    case 'vlang':S.vlang=S.vlang==='en-IN'?'hi-IN':'en-IN';t.textContent='Voice: '+(S.vlang==='en-IN'?'English / Hinglish':'Hindi');break;
    case 'hint':var ta=$('#ta');if(ta){ta.value=HINTS[Math.floor(Math.random()*HINTS.length)];ta.focus()}break;
    case 'end':
      var n=S.turns.filter(function(x){return x.who==='you'}).length;
      if(n<2){toast(`Say a bit more first. Coaching needs at least two replies from you.`);break}
      stopSay();stopMic();S.view='debrief';runCoach();break;
    case 'recoach':runCoach();break;
    case 'again':startSession(S.persona.id);break;
    case 'gseg':S.gseg=t.dataset.k;render();break;
    case 'gcat':S.gcat=t.dataset.c;render();break;
    case 'lseg':S.lseg=t.dataset.k;render();break;
    case 'lcat':S.lcat=t.dataset.c;render();break;
    case 'learnprac':if(S.ai==='off'){toast(`Practice is not available in this view.`);break}S.tab='practice';startSession(t.dataset.id);break;
    case 'logreal':
      var theme=$('#lgT').value,prod=$('#lgP').value,txt=$('#lgX').value.trim().slice(0,240),res=$('#lgR').value;
      saveRec({type:'real',product:prod,theme:theme,text:txt,result:res});toast(`Logged. Thank you.`);render();break;
  }
});
document.addEventListener('keydown',function(e){
  if(e.target&&e.target.id==='ta'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendTxt(e.target.value)}
});
document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='ta'){e.target.style.height='auto';e.target.style.height=Math.min(130,e.target.scrollHeight)+'px'}
  if(e.target&&e.target.id==='q'){var r=$('#sres');if(r)r.innerHTML=searchHtml(e.target.value)}
});

/* ---------- CAPABILITIES ---------- */
(async function(){
  render();
  try{
    if(window.claude&&window.claude.use){
      sampleFn=await window.claude.use('sample');
      S.ai=sampleFn?'ok':'off';
      try{
        var db=await window.claude.use('db');
        if(db){
          dbRef=db;
          db.collection('sessions').orderBy('ts','desc').limit(500).onSnapshot(function(snap){
            S.dbDocs=snap.docs.map(function(d){return d.data()});
            if(S.tab==='insights'||(S.tab==='home'&&!($('#q')&&$('#q').value)))render();
          },function(){S.dbDocs=null});
        }
      }catch(e){}
    }else S.ai='off';
  }catch(e){S.ai='off'}
  var qq=$('#q');if(S.view!=='session'&&!S.coaching&&!(qq&&qq.value))render();
})();
})();
</script>
